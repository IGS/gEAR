name: Pip audit check

on:
  push:
    branches: [devel, main]
    paths:
      - "lib/**"
      - "www/cgi/**"
      - "www/api/**"
      - "listeners/**"
      - "services/**"
      - 'docker/*'
      - '.github/*'
  pull_request:
    branches: [devel, main]
    paths:
      - "lib/**"
      - "www/cgi/**"
      - "www/api/**"
      - "listeners/**"
      - "services/**"
      - 'docker/*'
      - '.github/*'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: python -m pip install -r docker/requirements.txt -r listeners/requirements.txt -r services/projectr/requirements.txt -r services/spatial/requirements.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0