name: Python tests

# Server-side test suite in tests/python: CGI scripts (run against a fake database),
# the Flask API resources, the upload processors, and documentation checks.
# No live server, MySQL or gear.ini is needed. See docs/developer/testing.md.

on:
  push:
    branches: [devel, main]
    paths:
      - "lib/**"
      - "www/cgi/**"
      - "www/api/**"
      - "www/user_templates/**"
      - "listeners/**"
      - "services/**"
      - "docs/**"
      - "README.md"
      - "tests/python/**"
      - "tests/README.md"
      - ".github/workflows/python_tests.yml"
  pull_request:
    branches: [devel, main]
    paths:
      - "lib/**"
      - "www/cgi/**"
      - "www/api/**"
      - "www/user_templates/**"
      - "listeners/**"
      - "services/**"
      - "docs/**"
      - "README.md"
      - "tests/python/**"
      - "tests/README.md"
      - ".github/workflows/python_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (CGI, API, processors, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # production runs Python 3.14 (see docker/Dockerfile.python)
          cache: pip
          cache-dependency-path: tests/python/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Run tests
        working-directory: tests/python
        # No -m filter: tests for optional stacks (marked e.g. "spatial" in pytest.ini) skip
        #  themselves because only requirements.txt is installed here, so new stacks need no
        #  change to this job. The skips are listed in the test summary.
        run: python -m pytest

  spatial:
    name: Spatial handlers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/python/requirements-spatial.txt

      - name: Install dependencies
        run: pip install -r tests/python/requirements-spatial.txt

      - name: Run tests
        working-directory: tests/python
        # -m spatial selects only the tests marked @pytest.mark.spatial (see pytest.ini)
        run: python -m pytest -m spatial
