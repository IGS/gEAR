<VirtualHost *:80>
  DocumentRoot /var/www
  CustomLog    /var/log/apache2/ssl_umgear_access.log combined
  ErrorLog     /var/log/apache2/ssl_umgear_error.log

  # This is needed because the Numba module attempts to write
  #  cacha data where it doesn't have permission due to lazy developers
  #  assuming everyone will use virtualenv all the time.
  #  https://github.com/ska-sa/montblanc/issues/253
  SetEnv NUMBA_CACHE_DIR /tmp/numba_cache

  <Directory />
    Options FollowSymLinks
    AllowOverride None
  </Directory>

  <Directory /var/www>
      Options Indexes FollowSymLinks
      AllowOverride None
      Require all granted
  </Directory>

  <Directory /var/www/datasets/spatial/*.zarr>
    Options Indexes FollowSymLinks MultiViews
    Require all granted
    IndexOptions SuppressHTMLPreamble
    IndexIgnore ..  # hide parent directory
  </Directory>

  <Directory /var/www/cgi>
    Options ExecCGI FollowSymLinks
    SetHandler cgi-script
  </Directory>

  <Directory /var/www>
      Options +ExecCGI +Includes
      AddHandler cgi-script .py .cgi
      AddOutputFilter INCLUDES .html
  </Directory>

  TimeOut 150000
  KeepAliveTimeout 15000

  <IfModule retimeout_module>
    RequestReadTimeout header=120-240,minrate=500
    RequestReadTimeout body=0,minrate=0
  </IfModule>

  <IfModule mod_proxy.c>
    ProxyTimeout 15000
  </IfModule>

  <IfModule mod_fcgid.c>
    FcgidConnectTimeout 15000
  </IfModule>

  ## FLASK API

  # Route public traffic to the new standard Flask app
  WSGIDaemonProcess public_api user=www-data group=www-data processes=8 threads=4
  <Directory /var/www/api/public>
    WSGIProcessGroup public_api
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptReloading On
    <IfVersion < 2.4>
      Order allow,deny
      Allow from all
    </IfVersion>
    <IfVersion >= 2.4>
      Require all granted
    </IfVersion>
  </Directory>
  WSGIScriptAlias /api/public /var/www/api/public/public_api.wsgi

  # Route other (internal) API traffic
  WSGIDaemonProcess internal_api user=www-data group=www-data processes=8 threads=4
  <Directory /var/www/api/internal>
    WSGIProcessGroup internal_api
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptReloading On
    <IfVersion < 2.4>
      Order allow,deny
      Allow from all
    </IfVersion>
    <IfVersion >= 2.4>
      Require all granted
    </IfVersion>
  </Directory>
  WSGIScriptAlias /api /var/www/api/internal/api.wsgi

  ProxyPreserveHost On

  # If admin panel is enabled on server, view with /panel/ws/admin
  ProxyPass /panel/ws ws://panel:5006
  ProxyPassReverse /panel/ws ws://panel:5006

  ProxyPass /panel http://panel:5006
  ProxyPassReverse /panel http://panel:5006

  #RewriteEngine On
  # Rewrite all non-HTTPS requests to HTTPS.
  #RewriteCond %{HTTPS} off
  #RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R,L]
</VirtualHost>
# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
