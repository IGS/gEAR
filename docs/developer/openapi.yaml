                  user:
                    $ref: '#/components/schemas/Cgi1DatasetCollection'
                  shared_with_user:
                    $ref: '#/components/schemas/Cgi1DatasetCollection'
  /cgi/get_h5ad_obs_columns.cgi:
    post:
      operationId: cgiGetH5adObsColumns
