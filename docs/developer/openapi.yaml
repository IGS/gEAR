        type:
          $ref: '#/components/schemas/Cgi1AnalysisType'
        dataset_id:
          type: string
        label:
          type: string
        success:
          type: integer
          enum:
          - 0
          description: Present only on error
        error:
          type: string
    Cgi2AnalysisForm:
      type: object
      description: Common workbench fields. If analysis_id and analysis_type are both empty the dataset's primary
        analysis is used. session_id is used to locate user_saved/user_unsaved analysis directories; login is not
        enforced.
      required:
      - dataset_id
      properties:
        dataset_id:
          type: string
          description: Dataset UUID.
        analysis_id:
          type: string
          description: Analysis UUID (optional).
        analysis_type:
          type: string
          enum:
          - primary
          - public
          - user_saved
          - user_unsaved
          description: Discovered automatically if analysis_id is given without a type.
        session_id:
          type: string
          description: Current session ID.
    Cgi2GroupLabel:
      type: object
      properties:
        group_label:
          type: string
          description: Cluster ID/label.
        num_cells:
          type: integer
        genes:
          type: string
          description: Top gene symbol (find_marker_genes) or new cluster label (generate_clusters).
    Cgi2MissingGeneResult:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
        missing_gene:
          description: Empty string on success; on an unknown gene, a one-element array (regex groups tuple) or
            `Unknown`. Omitted if the dataset/analysis was not found.
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    Cgi2SuccessInt:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
    Cgi2SuccessError:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
        error:
          type: string
          description: Present on failure.
    Cgi2SessionDatasetForm:
      type: object
      required:
      - session_id
      - dataset_id
      properties:
        session_id:
          type: string
          description: Session of the dataset owner.
        dataset_id:
          type: string
    Cgi2LoginV1Form:
      type: object
      required:
      - user_email
      properties:
        user_email:
          type: string
        user_pass:
          type: string
          format: password
          description: Treated as empty string if missing.
    Cgi2LoginV2Form:
      type: object
      required:
      - user-email
      properties:
        user-email:
          type: string
        user-password:
          type: string
          format: password
          description: Treated as empty string if missing.
    Cgi2UploadProcessResult:
      type: object
      properties:
        success:
          description: 0 on validation errors, true when queued, or the synchronous processor's result.
          oneOf:
          - type: integer
          - type: boolean
        message:
          type: string
    Cgi3SuccessError:
      type: object
      description: Common CGI result. Failures are returned with HTTP 200.
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
          description: 1 on success, 0 on failure.
        error:
          type: string
          description: Error message (empty or absent on success).
    Cgi3SuccessMessage:
      type: object
      description: CGI result with a status message. Failures are returned with HTTP 200.
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
        message:
          type: string
          description: Human-readable status or error message.
    Cgi3Message:
      type: object
      properties:
        message:
          type: string
          description: Error message.
    Cgi3Pagination:
      type: object
      properties:
        total_results:
          type: integer
        current_page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
