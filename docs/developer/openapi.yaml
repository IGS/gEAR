      - Plots
      summary: Build a multi-gene Plotly figure (dotplot, heatmap, mg_violin, volcano, quadrant).
      description: Builds a multi-gene Plotly figure using gear.mg_plotting. Wrapped in @catch_memory_error, so
        a MemoryError returns HTTP 500. Called by apiCallsMixin.fetchMgPlotlyData in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
