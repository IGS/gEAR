      description: For scope=unweighted-list returns a single 'unweighted' binary pattern without checking the cart.
        Otherwise reads carts/cart.<source_id>.tab and returns each weight column with its top 5 up/down genes;
        a missing file returns [].
      requestBody:
        required: true
        content:
