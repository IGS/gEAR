  /api/plot/{dataset_id}/spatial_scanpy:
    post:
      operationId: getSpatialScanpyData
      tags:
      - Plots
      summary: Render a spatial comparison figure (spatial, UMAP and violin plots) as a base64 image.
      description: Loads a spatial analysis, runs filter_cells(min_genes=200), normalize_total, log1p, PCA, neighbors
        and UMAP, and renders a comparison figure for the requested genes. Called by apiCallsMixin.fetchSpatialScanpyImage
        in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gene_symbols
              properties:
                gene_symbols:
                  type: array
                  items:
                    type: string
                  description: Genes to plot (matched case-insensitively; unknown genes are dropped).
                analysis:
                  $ref: '#/components/schemas/ApiAnalysisRef'
                projection_id:
                  type: string
                  nullable: true
                  description: projectR projection ID.
                colorblind_mode:
                  type: boolean
                  default: false
                  description: Use colorblind-friendly palettes.
                high_dpi:
                  type: boolean
                  default: false
                  description: Save as PNG at higher dpi instead of WebP.
      responses:
        '200':
          description: '{success, message, image}. The image is base64 WebP, or PNG when high_dpi is true; no image_format
            key is returned. Errors return HTTP 200 with success -1 (no gene symbols, "Could not create dataset
            object using analysis.", projection PlotError).'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    message:
                      type: string
                      description: Always empty on success.
                    image:
                      type: string
                      format: byte
                      description: Base64-encoded WebP or PNG.
                - $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unhandled exception (e.g. no JSON body, since req.get is called on None).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/plot/{dataset_id}/spatialpanel:
    post:
      operationId: getSpatialPanel
      tags:
      - Plots
      summary: Prepare cached spatial data and return a script tag embedding the HoloViz Panel viewer.
      description: Caches the spatial image (spatial_img_<channel>.npy, spatial_props.json) and a per-gene CSV under
        www/cache/spatial_panel/{dataset_id}/, then returns a Bokeh server_document script pointing at <domain>/panel/ws/panel_app
        (or panel_app_expanded when is_zoomed). Does not read the session cookie. Called by apiCallsMixin.prepSpatialPanelData
        in www/js/common.v2.js.
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gene_symbol:
                  type: string
                  description: Gene symbol, or a pattern name when projection_id is set.
                projection_id:
                  type: string
                  nullable: true
                  description: projectR projection ID.
                is_zoomed:
                  type: boolean
                  default: false
                  description: Use the expanded Panel app (panel_app_expanded).
                min_genes:
                  type: integer
                  default: 0
                  description: Parsed as int but otherwise unused by the handler.
                expression_min_clip:
                  type: number
                  nullable: true
                  description: Lower clip for expression values (passed to the Panel app config).
                disable_save:
                  type: boolean
                  default: true
                  description: Disable the Panel app's save-display button (sent as "nosave").
                x_range_start:
                  type: number
                  description: Initial view range; used only if all four range keys are given.
                x_range_end:
                  type: number
                  description: Initial view range.
                y_range_start:
                  type: number
                  description: Initial view range.
                y_range_end:
                  type: number
                  description: Initial view range.
      responses:
        '200':
          description: '{script, success, message}. On failure success is 0, script is null and message holds the
            error ("No JSON body provided in the request.", "Error preparing data image: ...", "Error preparing
            data markers: ...", or "... Error generating viewer script: ...").'
          content:
            application/json:
              schema:
                type: object
                properties:
                  script:
                    type: string
                    nullable: true
                    description: HTML <script> tag that embeds the Panel app.
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                    description: 1 on success, 0 on failure.
                  message:
                    type: string
                    description: Informational notes (cache use) or error text.
  /api/plot/{dataset_id}/svg:
    get:
      operationId: getSvgData
      tags:
      - Plots
      summary: Get expression values and score ranges for coloring a dataset's SVG image.
      description: Reads the primary dataset h5ad directly with scanpy (analyses are ignored) and returns the gene's
        expression per observation plus min/max ranges. Does not read the session cookie. Called by apiCallsMixin.fetchSvgData
        in www/js/common.v2.js.
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      - name: gene
        in: query
        required: true
        description: Gene symbol (exact match against var.gene_symbol).
        schema:
          type: string
      - name: projection_id
        in: query
        required: false
        description: projectR projection ID; plot pattern values instead of expression.
        schema:
          type: string
      - name: expression_min_clip
        in: query
        required: false
        description: Lower clip for expression values; must parse as a float.
        schema:
          type: number
      - name: vmin
        in: query
        required: false
        description: User-defined color minimum. "0" or absent is treated as 0.0 when vmax is given.
        schema:
          type: number
      - name: vmax
        in: query
        required: false
        description: User-defined color maximum. "0" or absent falls back to the gene maximum when vmin is given.
        schema:
          type: number
      responses:
        '200':
          description: 'Expression data. success is 2 (with a warning message) when the symbol maps to several Ensembl
            IDs; the first is used. Errors return HTTP 200 with success -1: non-numeric expression_min_clip, missing
            gene, dataset not found, h5ad file not found, projection PlotError, missing gene_symbol column, or gene
            not found.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiSvgDataResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
  /api/plot/{dataset_id}/tsne:
    post:
      operationId: getTsneData
      tags:
      - Plots
      summary: Render a static single-gene embedding plot (tSNE/UMAP/PCA) as a base64 image.
      description: Renders a scanpy/matplotlib embedding plot for one gene. Parameters are parsed by reqparse (single_gene_parser
        in resources/tsne_data.py); keys without location="json" (plot_type, x_axis, y_axis, colorize_legend_by,
        max_columns, expression_palette, marker_size, vmin, vmax, projection_id, expression_min_clip, gene_symbol,
        plot_by_group) may also be sent as query/form values. Called by apiCallsMixin.fetchTsneImage in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTsneDataRequest'
      responses:
        '200':
          description: '{success, message, image, image_format}. image_format is "webp", "png" when the figure exceeds
            the 16383 px WebP limit, or "pdf" when high_dpi is true. success is 2 when duplicate genes were deduplicated.
            Errors return HTTP 200 with success -1 (no gene symbol, dataset not found, analysis unavailable, cannot
            load AnnData, projection PlotError, missing gene_symbol column, gene/axis validation failure, invalid
            vmin/vmax/median-centering combination).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiImageResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: reqparse type validation failure (bundle_errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReqparseError'
        '500':
          description: 'Unhandled exception. Quirk: an unknown plot_type raises KeyError, but the handler only catches
            ValueError, so it surfaces as a 500 instead of the intended success -1 message.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/projectr/{dataset_id}:
    post:
      operationId: runProjectR
      tags:
      - Projection
      summary: Start (or reuse) a projectR projection of a gene cart onto a dataset.
      description: Returns a completed status if the projection CSV (and p-value CSV when full output is requested)
        already exists; returns an existing pending/running/complete job status unchanged; returns "running" when
        a lock file exists; otherwise writes a pending status and either publishes the job to the RabbitMQ queue
        "projectr" ([projectR_service] queue_enabled) or runs projectr_callback synchronously. Clients poll GET
        /api/projectr/{projection_id}/status. Called by apiCallsMixin.fetchProjection in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Target dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ApiProjectRRequest'
              - type: object
                properties:
                  projection_id:
                    type: string
                    description: Projection UUID. When omitted, a deterministic UUID is derived from (dataset_id,
                      genecart_id, algorithm, zscore).
      responses:
        '200':
          description: Job status. Failures are reported as status "failed" with the reason in error (still HTTP
            200), e.g. unweighted lists with NMF algorithms, gene list not found/empty, analysis unavailable, RabbitMQ
            connection/publish errors, projectR timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProjectRJobStatus'
        '400':
          description: 'reqparse failure (missing genecart_id or bad boolean) as {"message": {...}}, or unsafe path
            components ("Invalid projection path parameters.") via abort.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiReqparseError'
                - $ref: '#/components/schemas/ApiMessageError'
        '403':
          description: Resolved projection CSV path is outside www/projections ("Invalid dataset path").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
        '500':
          description: MemoryError in the synchronous projectr_callback (@catch_memory_error), or an unhandled exception
            (e.g. an invalid dataset_id for the projections JSON path raises ValueError).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiMemoryErrorResponse'
                - $ref: '#/components/schemas/ApiMessageError'
  /api/projectr/{dataset_id}/output_file:
    post:
      operationId: getProjectROutputFile
      tags:
      - Projection
      summary: Check whether a projection already exists for this dataset, gene cart, algorithm and zscore.
      description: 'Looks up the dataset''s projections.json for a config matching genecart_id, algorithm and zscore
        and returns its UUID if the CSV exists. Side effect: creates the by_dataset/{dataset_id} and by_genecart/{genecart_id}
        directories and empty projections.json files when missing, and migrates legacy "cart.<id>" entries. scope,
        full_output and analysis are parsed but unused. Does not read the session cookie. Called by apiCallsMixin.checkForProjection
        in www/js/common.v2.js.'
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Target dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiProjectRRequest'
      responses:
        '200':
          description: Existing projection ID, or null if none matches or its CSV is missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projection_id:
                    type: string
                    nullable: true
                    description: UUID of the matching projection, or null.
        '400':
          description: 'reqparse failure (missing genecart_id, bad boolean) as {"message": {...}}, or unsafe path
            components via abort when building the CSV path.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiReqparseError'
                - $ref: '#/components/schemas/ApiMessageError'
        '500':
          description: Unhandled exception (e.g. build_projection_json_path raises ValueError for an unsafe ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/projectr/{projection_id}/status:
    get:
      operationId: getProjectRStatus
      tags:
      - Projection
      summary: Poll the status of a projectR job.
      description: Returns the contents of www/projections/job_status/job_{projection_id}.json. When the status
        is "complete" the file is deleted after it is read, so the next poll returns 404. Does not read the session
        cookie. Called by apiCallsMixin.pollProjectRStatus in www/js/common.v2.js.
      parameters:
      - name: projection_id
        in: path
        required: true
        description: Projection UUID (sanitized with secure_filename).
        schema:
          type: string
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProjectRJobStatus'
        '403':
          description: Resolved path escapes the job status directory ("Invalid job id/path").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
        '404':
          description: Job status file not found ("Job status file not found").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /cgi/add_display_to_layout.cgi:
    post:
      operationId: cgiAddDisplayToLayout
      tags:
      - Collections (layouts)
      summary: Add a dataset display as a member of a layout (collection)
      description: Requires a logged-in user who owns the layout. Computes the next free grid position (width 4
        for single-gene, 6 for multi-gene displays) and, if the layout is in "legacy" mode (every member has start_col
        1), first rebuilds all member grid positions. Errors are returned with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              - display_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in layout owner
                layout_share_id:
                  type: string
                  description: Share ID of the target layout
                display_id:
                  type: integer
                  description: ID of the dataset display to add
      responses:
        '200':
          description: Result of the add (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1SuccessError'
  /cgi/add_layout.cgi:
    post:
      operationId: cgiAddLayout
      tags:
      - Collections (layouts)
      summary: Create a new, empty layout (collection) for the user
      description: Requires a logged-in user. Saves an empty, non-current layout with the given label and records
        a 'layout_added' user-history entry. Note the response has no success key; failure is signalled only by
        an 'error' key (HTTP 200).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_name
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user
                layout_name:
                  type: string
                  description: Label for the new layout
      responses:
        '200':
          description: The new layout's label and share ID, or an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout_label:
                    type: string
                    description: Label of the created layout
                  layout_share_id:
                    type: string
                    description: Share ID of the created layout
                  error:
                    type: string
                    description: Present only on failure (user not logged in)
  /cgi/add_to_user_history.cgi:
    post:
      operationId: cgiAddToUserHistory
      tags:
      - Account/auth
      summary: Record an entry in the user's activity history
      description: Every submitted form field is forwarded as a keyword argument to UserHistory.add_record(), so
        category-specific extras (search_terms, gene_symbol, layout_share_id, dataset_share_id, gene_cart_share_id,
        gene_cart, multi, patterns, algo) must be sent as extra fields. Requires a valid session; a missing or invalid
        session raises an uncaught exception. Prints only a Content-Type header with an empty body. No current frontend
        caller found.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - entry_category
              - label
              additionalProperties:
                type: string
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user
                entry_category:
                  type: string
                  description: History category (validated in gear/userhistory.py; others raise)
                  enum:
                  - dataset_search
                  - gene_cart_added
                  - gene_cart_search
                  - gene_search
                  - layout_added
                  - multigene_search
                  - projection_run
                label:
                  type: string
                  description: Label shown in the user history table
      responses:
        '200':
          description: Empty body (application/json Content-Type header only).
  /cgi/apply_note_changes.cgi:
    post:
      operationId: cgiApplyNoteChanges
      tags:
      - Datasets
      summary: Create, edit, or remove a dataset note
      description: Requires a logged-in user. The action is chosen by 'scope'. Only 'remove' checks note ownership;
        'edit' updates any note ID without an ownership check. An unrecognized scope returns success 0 with no error.
        Errors are returned with HTTP 200. No current frontend caller found (legacy).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - scope
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user
                scope:
                  type: string
                  enum:
                  - new
                  - edit
                  - remove
                  description: Action to perform
                note_id:
                  type: integer
                  description: Note ID (required for edit and remove)
                dataset_id:
                  type: string
                  description: Dataset ID the note is attached to (scope=new)
                title:
                  type: string
                  description: Note title (new/edit)
                ldesc:
                  type: string
                  description: Note body (new/edit)
                access_level:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: Stored as note.is_public (new/edit)
      responses:
        '200':
          description: Result of the note operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  notes:
                    type: array
                    items: {}
                    description: Always empty
                  error:
                    type: string
                    description: Present on failure
  /cgi/apply_obs_dtype_choices.cgi:
    post:
      operationId: cgiApplyObsDtypeChoices
      tags:
      - Uploads
      summary: Apply user-chosen dtypes to flagged obs columns of a staged upload
      description: Used by the uploader's "Review column types" step. Requires a valid session. Rewrites only the
        obs of the staged H5AD (or the 'table' group of a spatial Zarr store) under uploads/files/<session_id>/<share_uid>/,
        then sets obs_dtype_reviewed=true and clears questionable_obs_columns in metadata.json. Errors are returned
        with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              - choices
              properties:
                session_id:
                  type: string
                  description: Session ID of the uploading user (also the upload directory name)
                share_uid:
                  type: string
                  description: Share UID of the upload in progress
                choices:
                  type: string
                  description: 'JSON object mapping obs column name to ''categorical'' or ''continuous'', e.g. {"replicate":
                    "categorical"}'
      responses:
        '200':
          description: Result of applying the dtype choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1SuccessMessage'
  /cgi/check_dataset_processing_status.cgi:
    post:
      operationId: cgiCheckDatasetProcessingStatus
      tags:
      - Uploads
      summary: Report processing status/progress of an uploading dataset
      description: Reads uploads/files/<session_id>/<share_uid>/status.json; for legacy 'processing' entries with
        no job UUID it checks that the recorded process ID is still running. The session is not validated against
        the database (it is used only as a directory name). The upload page now uses /api/import/dataset/<share_uid>/status;
        this CGI is kept for manual checks (e.g. curl GET).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              properties:
                session_id:
                  type: string
                  description: Session ID of the uploading user
                share_uid:
                  type: string
                  description: Share UID of the upload
      responses:
        '200':
          description: Processing status (errors are status 'error' with job_id -1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1ProcessingStatus'
    get:
      operationId: cgiCheckDatasetProcessingStatusGet
      tags:
      - Uploads
      summary: Report processing status/progress of an uploading dataset (query string)
      description: Same as the POST form; the script's docstring documents calling it by hand with a GET query string.
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
        description: Session ID of the uploading user
      - name: share_uid
        in: query
        required: true
        schema:
          type: string
        description: Share UID of the upload
      responses:
        '200':
          description: Processing status (errors are status 'error' with job_id -1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1ProcessingStatus'
  /cgi/check_existing_email.cgi:
    post:
      operationId: cgiCheckExistingEmail
      tags:
      - Account/auth
      summary: Check whether an email address already has an account
      description: Whitespace is stripped from the address before lookup. A missing email raises an uncaught exception
        after the header is printed (empty body). No login required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: Email address to check
      responses:
        '200':
          description: Whether the email exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_exists:
                    type: integer
                    enum:
                    - 0
                    - 1
  /cgi/copy_dataset_analysis.cgi:
    post:
      operationId: cgiCopyDatasetAnalysis
      tags:
      - Analysis/workbench
      summary: Copy or move a stored analysis between analysis classes
      description: Supports only user_unsaved->user_saved (move, open perms), user_saved->public (move, read-only
        perms) and public->user_unsaved (copy); other combinations return an error. Rewrites the analysis config's
        id, type and analysis_session_id. No user login check is made (session_id locates user_unsaved analyses).
        Errors are returned with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              - source_analysis_id
              - source_analysis_type
              - dest_analysis_id
              - dest_analysis_type
              properties:
                session_id:
                  type: string
                  description: Session ID (used for analysis paths)
                dataset_id:
                  type: string
                  description: Dataset ID
                source_analysis_id:
                  type: string
                  description: Source analysis UUID
                source_analysis_type:
                  $ref: '#/components/schemas/Cgi1AnalysisType'
                dest_analysis_id:
                  type: string
                  description: Destination analysis UUID
                dest_analysis_type:
                  $ref: '#/components/schemas/Cgi1AnalysisType'
      responses:
        '200':
          description: Result of the copy/move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1SuccessError'
  /cgi/create_account.cgi:
    post:
      operationId: cgiCreateAccount
      tags:
      - Account/auth
      summary: Create a new user account and return a session ID
      description: 'Verifies verification_code_short against the long code, stores a SHA3-256 password hash, and
        creates a session. session_id is 0 on failure, -1 if the user already exists, else a UUID. Quirk: when the
        user already exists the script prints two JSON objects back to back (first success 0, then success 1 with
        session_id -1).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - password
              - verification_code_long
              - verification_code_short
              properties:
                first-last:
                  type: string
                  description: User's full name
                email:
                  type: string
                  description: Email address (account key)
                institution:
                  type: string
                  description: Institution
                password:
                  type: string
                  format: password
                  description: Plain-text password
                email_updates:
                  type: string
                  enum:
                  - 'yes'
                  description: '''yes'' to opt in to email updates'
                colorblind_mode:
                  type: string
                  enum:
                  - 'yes'
                  description: '''yes'' to enable colorblind mode'
                verification_code_long:
                  type: string
                  description: Long-form verification code
                verification_code_short:
                  type: string
                  description: Short code the user typed
      responses:
        '200':
          description: Account creation result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  session_id:
                    description: 0 = failure, -1 = user already exists, otherwise the new session UUID
                    oneOf:
                    - type: string
                    - type: integer
                  long_session:
                    type: integer
                    enum:
                    - 0
                    - 1
                    description: Always 1 (remember-me is hardcoded)
                  error:
                    type: string
  /cgi/create_github_issue.cgi:
    post:
      operationId: cgiCreateGithubIssue
      tags:
      - Misc
      summary: Create a GitHub issue from the site comment/feedback form
      description: Posts an issue (label site_comment) to jorvis/gEAR, or to IGS/gEAR when private_check is the
        string 'false', then adds it to the "Site Comments" project column. No login required. A screenshot is passed
        by file name (previously uploaded to contact_screenshots/files) and symlinked to a public URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                comment_title:
                  type: string
                  description: Issue title
                comment:
                  type: string
                  description: Comment body
                comment_tag:
                  type: string
                  description: Comma-space separated tags (put in the issue body)
                submitter_firstname:
                  type: string
                submitter_lastname:
                  type: string
                submitter_email:
                  type: string
                private_check:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: '''false'' sends to the public IGS repo; anything else to the private repo'
                screenshot:
                  type: string
                  description: File name of an already-uploaded screenshot, or 'null'
      responses:
        '200':
          description: Issue creation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  error:
                    description: Empty list on success, error string on failure
                    oneOf:
                    - type: array
                      items: {}
                    - type: string
  /cgi/delete_dataset_analysis.cgi:
    post:
      operationId: cgiDeleteDatasetAnalysis
      tags:
      - Analysis/workbench
      summary: Delete a user's stored (non-primary) analysis
      description: Requires a logged-in user who owns the analysis. Primary analyses cannot be deleted, and the
        directory is only removed if its name is a UUID. Errors are returned with HTTP 200 and success 0 (a missing
        dataset returns success 0 with an empty error).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - analysis_id
              - analysis_type
              properties:
                session_id:
                  type: string
                  description: Session ID of the analysis owner
                dataset_id:
                  type: string
                analysis_id:
                  type: string
                  description: Analysis UUID
                analysis_type:
                  $ref: '#/components/schemas/Cgi1AnalysisType'
      responses:
        '200':
          description: Result of the delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1SuccessError'
  /cgi/delete_dataset_display.cgi:
    post:
      operationId: cgiDeleteDatasetDisplay
      tags:
      - Displays
      summary: Delete a saved dataset display owned by the user
      description: Requires a session whose user owns the display. A display that does not exist is treated as already
        deleted (success true). Returns success false if parameters are missing or the user is not the owner.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - id
              properties:
                session_id:
                  type: string
                  description: Session ID of the display owner
                id:
                  type: integer
                  description: Display ID
      responses:
        '200':
          description: Result of the delete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /cgi/delete_upload_in_progress.cgi:
    post:
      operationId: cgiDeleteUploadInProgress
      tags:
      - Uploads
      summary: Delete one of the user's in-progress upload directories
      description: Requires a logged-in user. Recursively removes uploads/files/<session_id>/<share_uid> after validating
        both path components. dataset_id is read but unused. Errors are returned with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              properties:
                session_id:
                  type: string
                  description: Session ID of the uploading user
                share_uid:
                  type: string
                  description: Share UID of the upload to delete
                dataset_id:
                  type: string
                  description: Unused
      responses:
        '200':
          description: Result of the delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1SuccessMessage'
  /cgi/download_projection.cgi:
    post:
      operationId: cgiDownloadProjection
      tags:
      - Projection
      summary: Download projection coefficient (and p-value) CSVs as a zip
      description: Zips <projection_id>.coeff.csv and, if present, <projection_id>.pval.csv from projections/by_dataset/<dataset_id>/.
        share_id takes precedence over the legacy dataset_id. No login check. Any error (missing IDs, dataset or
        file not found) raises an uncaught exception before headers are printed, so the server returns HTTP 500.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi1DownloadProjectionParams'
      responses:
        '200':
          description: Zip archive (Content-Disposition attachment; filename=<projection_id>.zip).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Uncaught exception (missing parameters or files).
    get:
      operationId: cgiDownloadProjectionGet
      tags:
      - Projection
      summary: Download projection coefficient (and p-value) CSVs as a zip (query string)
      description: Same as the POST form; the frontend (tilegrid.js) links to it with a GET URL.
      parameters:
      - name: share_id
        in: query
        schema:
          type: string
        description: Dataset share ID (preferred)
      - name: dataset_id
        in: query
        schema:
          type: string
        description: Dataset ID (legacy; used if share_id absent)
      - name: projection_id
        in: query
        required: true
        schema:
          type: string
        description: Projection ID
      responses:
        '200':
          description: Zip archive (Content-Disposition attachment; filename=<projection_id>.zip).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Uncaught exception (missing parameters or files).
  /cgi/download_source_file.cgi:
    post:
      operationId: cgiDownloadSourceFile
      tags:
      - Datasets
      summary: Download a dataset's source archive, H5AD, or metadata CSV
      description: type=tarball streams the original upload archive (.tar.gz, .tar or .zip), type=h5ad the dataset
        H5AD (or an analysis's H5AD when analysis_id is given; session_id is needed for user_unsaved analyses),
        type=metadata a CSV built from the stored metadata (looked up by share_id only). No login or is_downloadable
        check is made. Errors raise uncaught exceptions before headers, so the server returns 500.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi1DownloadSourceParams'
      responses:
        '200':
          description: File attachment named <share_id>.<ext> (tar.gz/tar/zip, h5ad, or metadata.csv).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Uncaught exception (missing parameters, dataset or file not found).
    get:
      operationId: cgiDownloadSourceFileGet
      tags:
      - Datasets
      summary: Download a dataset's source archive, H5AD, or metadata CSV (query string)
      description: Same as the POST form; the frontend builds GET URLs (tilegrid.js, dataset_explorer.js, analysis.js).
      parameters:
      - name: share_id
        in: query
        schema:
          type: string
        description: Dataset share ID (preferred; required for type=metadata)
      - name: dataset_id
        in: query
        schema:
          type: string
        description: Dataset ID (legacy)
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - tarball
          - h5ad
          - metadata
        description: What to download
      - name: analysis_id
        in: query
        schema:
          type: string
        description: Download this analysis's H5AD instead (type=h5ad)
      - name: session_id
        in: query
        schema:
          type: string
        description: Needed to locate user_unsaved analyses
      responses:
        '200':
          description: File attachment named <share_id>.<ext>.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Uncaught exception (missing parameters, dataset or file not found).
  /cgi/download_weighted_gene_cart.cgi:
    post:
      operationId: cgiDownloadWeightedGeneCart
      tags:
      - Gene lists (carts)
      summary: Download a weighted gene cart's tab-delimited file
      description: 'Streams carts/cart.<share_id>.tab. No login check. Quirk: the Content-Disposition filename is
        the full server-side path. A missing share_id raises before headers (HTTP 500).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - share_id
              properties:
                share_id:
                  type: string
                  description: Gene cart share ID
      responses:
        '200':
          description: Tab-delimited gene cart file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Uncaught exception (missing share_id or file).
  /cgi/finalize_uploaded_expression_dataset.cgi:
    post:
      operationId: cgiFinalizeUploadedExpressionDataset
      tags:
      - Uploads
      summary: Finalize an upload by saving metadata to MySQL and migrating files
      description: Requires a logged-in user. Saves metadata.json to MySQL (status completed), moves the H5AD (or
        spatial Zarr / gosling track hub) and the original upload file into place, optionally migrates the primary
        analysis JSON and preliminary plots, then deletes the upload directory. Returns per-step flags; errors are
        returned with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              - dataset_uid
              - dataset_format
              - dataset_visibility
              properties:
                session_id:
                  type: string
                  description: Session ID of the uploading user
                share_uid:
                  type: string
                  description: Share UID of the upload
                dataset_uid:
                  type: string
                  description: Dataset ID to create
                dataset_format:
                  type: string
                  enum:
                  - mex_3tab
                  - excel
                  - rds
                  - h5ad
                  - spatial
                  - gosling
                  description: Upload format ('null' is rejected)
                dataset_visibility:
                  type: string
                  enum:
                  - private
                  - public
                perform_analysis_migration:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: Move analysis_pipeline.json and prelim plots
      responses:
        '200':
          description: Per-step status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  metadata_loaded:
                    type: integer
                    enum:
                    - 0
                    - 1
                  h5ad_migrated:
                    type: integer
                    enum:
                    - 0
                    - 1
                  userdata_migrated:
                    type: integer
                    enum:
                    - 0
                    - 1
                  primary_analysis_migrated:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
  /cgi/get_PCs_from_anndata.cgi:
    post:
      operationId: cgiGetPCsFromAnndata
      tags:
      - Analysis/workbench
      summary: Return principal component loadings (varm['PCs']) for an analysis
      description: Loads the analysis AnnData and returns the PC loadings as a pandas 'split'-oriented frame (genes
        by PC1..PCn) plus gene symbols. No login check (session_id locates user analyses). Errors are returned with
        HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                session_id:
                  type: string
                dataset_id:
                  type: string
                analysis_id:
                  type: string
                analysis_type:
                  $ref: '#/components/schemas/Cgi1AnalysisType'
      responses:
        '200':
          description: PC loadings or error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
                  pc_data:
                    type: object
                    nullable: true
                    description: pandas split orient
                    properties:
                      index:
                        type: array
                        items:
                          type: string
                        description: Gene IDs
                      columns:
                        type: array
                        items:
                          type: string
                        description: PC1..PCn
                      data:
                        type: array
                        items:
                          type: array
                          items:
                            type: number
                  gene_symbols:
                    type: array
                    nullable: true
                    items:
                      type: string
  /cgi/get_ambiguous_obs_columns.cgi:
    post:
      operationId: cgiGetAmbiguousObsColumns
      tags:
      - Uploads
      summary: Return obs columns flagged as possibly mis-typed for upload review
      description: Requires a valid session. Reads only uploads/files/<session_id>/<share_uid>/metadata.json (no
        H5AD/Zarr is opened). Errors are returned with HTTP 200 and success 0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              properties:
                session_id:
                  type: string
                share_uid:
                  type: string
      responses:
        '200':
          description: Flagged columns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
                  questionable_columns:
                    type: object
                    additionalProperties: true
                    description: metadata.json questionable_obs_columns
                  reviewed:
                    type: boolean
                    description: metadata.json obs_dtype_reviewed
  /cgi/get_analysis_image.cgi:
    post:
      operationId: cgiGetAnalysisImage
      tags:
      - Analysis/workbench
      summary: Stream a PNG generated by an analysis step
      description: 'Returns <analysis dir>/figures/<analysis_name>.png (primary analyses are looked up as user_unsaved).
        If the dataset or analysis is missing it returns JSON {success: 0}; if the image is missing it sends Status
        404 with a plain-text body.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi1AnalysisImageParams'
      responses:
        '200':
          description: The PNG image, or JSON {success 0} if the dataset/analysis was not found.
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
        '404':
          description: Image file not found (plain text).
          content:
            text/plain:
              schema:
                type: string
    get:
      operationId: cgiGetAnalysisImageGet
      tags:
      - Analysis/workbench
      summary: Stream a PNG generated by an analysis step (query string)
      description: Same as the POST form; analysis.js fetches it with axios.get and uses the URL as an img src.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
      - name: dataset_id
        in: query
        required: true
        schema:
          type: string
      - name: analysis_id
        in: query
        schema:
          type: string
      - name: analysis_type
        in: query
        schema:
          $ref: '#/components/schemas/Cgi1AnalysisType'
      - name: analysis_name
        in: query
        required: true
        schema:
          type: string
        description: Scanpy figure base name, e.g. pca_variance_ratio
      responses:
        '200':
          description: The PNG image, or JSON {success 0} if the dataset/analysis was not found.
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
        '404':
          description: Image file not found (plain text).
          content:
            text/plain:
              schema:
                type: string
  /cgi/get_citation_from_pubmed_id.cgi:
    post:
      operationId: cgiGetCitationFromPubmedId
      tags:
      - Misc
      summary: Fetch a formatted citation for a PubMed ID
      description: Proxies the NCBI PMC citation API (format=citation) and returns its JSON unchanged. The in-memory
        cache and 0.4 s throttle live only for one CGI process, so they have no effect across requests.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - pubmed_id
              properties:
                pubmed_id:
                  type: string
                  description: PubMed ID
      responses:
        '200':
          description: Citation JSON from NCBI (or {raw} if it was not JSON).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: No pubmed_id provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1ErrorOnly'
        '502':
          description: NCBI request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1ErrorOnly'
  /cgi/get_condition_list.cgi:
    post:
      operationId: cgiGetConditionList
      tags:
      - Datasets
      summary: List unique condition labels (joined obs values) within a dataset
      description: Joins the remaining obs columns (after dropping replicate columns and a long skip list) with
        ';' to form class labels. Fails if more than 5 condition columns remain. success is only present on errors
        (0, or -1 for empty obs). No current frontend caller found (legacy).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                dataset_id:
                  type: string
      responses:
        '200':
          description: Conditions or error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_replicates:
                    type: integer
                    enum:
                    - 0
                    - 1
                  conditions:
                    type: array
                    items:
                      type: object
                      properties:
                        class_label:
                          type: string
                          description: ''';''-joined obs values'
                        formatted_class_label:
                          type: string
                          description: ''', ''-joined obs values'
                  success:
                    type: integer
                    enum:
                    - 0
                    - -1
                    description: Present only on error
                  error:
                    type: string
  /cgi/get_dataset_comparison.cgi:
    post:
      operationId: cgiGetDatasetComparison
      tags:
      - Analysis/workbench
      summary: Compare mean expression between two condition groups of a dataset
      description: 'Uses the primary analysis, optionally filters obs, computes per-gene means for X and Y groups,
        fold changes and (if statistical_test is set) Benjamini-Hochberg adjusted p-values via scanpy rank_genes_groups,
        then applies std-dev/fold-change cutoffs and optional log transform. Errors return HTTP 200 with success
        0. Quirks: an unknown dataset_id prints nothing; obs_filters must be valid JSON (an empty value raises).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              - compare_key
              - condition_x
              - condition_y
              - obs_filters
              properties:
                dataset_id:
                  type: string
                compare_key:
                  type: string
                  description: obs column the conditions come from
                condition_x:
                  type: string
                  description: JSON array of condition values for X
                condition_y:
                  type: string
                  description: JSON array of condition values for Y
                obs_filters:
                  type: string
                  description: 'JSON object {obs_column: [allowed values]}; may be {}'
                fold_change_cutoff:
                  type: number
                std_dev_num_cutoff:
                  type: number
                log_transformation:
                  type: string
                  enum:
                  - '2'
                  - '10'
                  description: Log base; anything else means none
                statistical_test:
                  type: string
                  enum:
                  - t-test
                  - t-test_overestim_var
                  - wilcoxon
                  description: Enables p-value ranking
      responses:
        '200':
          description: Comparison data or error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  error:
                    type: string
                  x:
                    type: array
                    items:
                      type: number
                  y:
                    type: array
                    items:
                      type: number
                  values:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                    description: '[x, y] pairs'
                  fold_changes:
                    type: array
                    items:
                      type: number
                  gene_ids:
                    type: array
                    items:
                      type: string
                  symbols:
                    type: array
                    items:
                      type: string
                  pvals_adj:
                    type: array
                    items:
                      type: number
                    description: Empty unless statistical_test given
                  fold_change_std_dev:
                    type: string
                    description: Formatted to 2 decimals
                  compare_key:
                    type: string
                  condition_x:
                    type: array
                    items:
                      type: string
                  condition_y:
                    type: array
                    items:
                      type: string
  /cgi/get_dataset_display.cgi:
    post:
      operationId: cgiGetDatasetDisplay
      tags:
      - Displays
      summary: Fetch a single dataset display by ID
      description: Returns the display record with parsed plotly_config, or {} if not found. No login check.
      requestBody:
        required: true
