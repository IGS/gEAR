                  description: Gene cart share ID (cart file root)
                pattern_id:
                  type: string
                  description: Weight column name
      responses:
        '200':
          description: Genes and weights.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    gene:
                      type: string
                    weight:
                      type: number
