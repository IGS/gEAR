          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiMgPlotlyDataRequest'
      responses:
        '200':
          description: '{success, message, plot_json}, or {success, message, image, image_format: "pdf"} when return_image
            is set. success is 1, or 2 when a warning is in message (duplicate Ensembl IDs, quadrant genes filtered
            out). Quirk: when some requested genes are not found, gear.mg_plotting.create_dataframe_gene_mask sets
            `success = 2,` (a tuple), so success serializes as [2]. Errors return HTTP 200 with success -1: no JSON
            body, dataset/file not found, no categorical obs columns, no genes for dotplot/heatmap/mg_violin, fewer
