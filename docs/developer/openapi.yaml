  /cgi/get_unweighted_gene_cart_preview.cgi:
    post:
      operationId: cgiGetUnweightedGeneCartPreview
      tags:
      - Gene lists (carts)
      summary: Preview genes (symbol, product) in an unweighted gene cart
      description: share_id is reduced to ASCII letters and digits. No login check. Errors return HTTP 200 with
        success 0 and message; a missing share_id field raises (empty body).
      requestBody:
