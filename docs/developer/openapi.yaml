      description: Fetches and parses the track hub at hub_url, looks up the gene position via the local /api/higlass/genes
        endpoint, and builds a Gosling spec (BAM, BED, bigWig, bigInteract, VCF and HiC tracks). The session cookie
        read is commented out. Called by apiCallsMixin.fetchGoslingDisplay in www/js/common.v2.js.
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID (only checked for existence).
        schema:
          type: string
      - name: gene
        in: query
        required: true
        description: Gene symbol to locate and zoom to.
        schema:
          type: string
      - name: assembly
        in: query
        required: true
        description: Genome assembly (e.g. hg38, mm10).
        schema:
          type: string
      - name: hub_url
        in: query
        required: true
        description: URL of the track hub.
        schema:
          type: string
      - name: zoom
        in: query
        required: false
        description: '"true" adds a second (right-hand) zoomed view; anything else is false.'
