                          type: string
                        product:
                          type: string
  /cgi/get_uploads_in_progress.cgi:
    post:
      operationId: cgiGetUploadsInProgress
      tags:
      - Uploads
      summary: List the user's incomplete uploads
      description: Scans uploads/files/<session_id>/ and derives each upload's status and resume step from metadata.json
        and status.json. The session is not validated against the database (used only as a directory name).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Uploads in progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
                  uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        share_id:
                          type: string
                        dataset_id:
                          type: string
                        dataset_type:
                          type: string
                        title:
                          type: string
                        dataset_format:
                          type: string
                        perform_primary_analysis:
                          type: boolean
                        status:
                          type: string
                          enum:
                          - metadata uploaded
                          - datafile uploaded
                          - queued
                          - processing
                          - processed
                          - complete
                          - error
                        load_step:
                          type: string
                          enum:
                          - upload-dataset
                          - process-dataset
                          - post-process-dataset
                          - finalize-dataset
                          - build-trackhub
  /cgi/get_user_gene_carts.cgi:
    post:
      operationId: cgiGetUserGeneCarts
      tags:
      - Gene lists (carts)
      summary: Return gene carts visible to the user, grouped by category
      description: Domain, public and shared (share_id) carts are always returned; user, group and recent carts
        only for a logged-in session. With group_by_type set, the response is instead keyed by cart type, each holding
        the six category lists. Despite the docstring, carts may appear in more than one category.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                share_id:
                  type: string
                  description: Gene cart share ID to include in shared_carts
                cart_type:
                  type: string
                  enum:
                  - unweighted-list
                  - weighted-list
                  - labeled-list
                  description: Filter by type ('null' = none)
                group_by_type:
                  type: string
                  description: Any value except 'false' groups results by cart type
                include_members:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 1
                  description: Include gene lists
      responses:
        '200':
          description: Cart categories (or, with group_by_type, an object keyed by cart type whose values have these
            keys).
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
                  user_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
                  group_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
                  recent_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
                  shared_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
                  public_carts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1GeneCart'
  /cgi/get_user_history_entries.cgi:
    post:
      operationId: cgiGetUserHistoryEntries
      tags:
      - Account/auth
      summary: Return the user's most recent history entries
      description: Returns [] if the session is not valid.
      requestBody:
