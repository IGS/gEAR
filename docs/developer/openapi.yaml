      operationId: cgiGetSharedUsersList
      tags:
      - Datasets
      summary: List users a dataset has been shared with (owner only)
      description: Requires a logged-in user who owns the dataset; otherwise success 0 with an error (HTTP 200).
        A missing session or unknown dataset raises (empty body). No current frontend caller found.
      requestBody:
