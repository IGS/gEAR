  /cgi/get_dataset_displays.cgi:
    post:
      operationId: cgiGetDatasetDisplays
      tags:
      - Displays
      summary: List the user's and the dataset owner's saved displays for a dataset
      description: session_id is optional; 'user' is filled only for a logged-in user and 'owner' only when the
        user is not the dataset owner. user_id is stripped from each display. An unknown dataset_id raises (empty/500
        response).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                dataset_id:
                  type: string
                session_id:
                  type: string
      responses:
        '200':
          description: Displays grouped by owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Display'
                  owner:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Display'
  /cgi/get_dataset_info.cgi:
    post:
      operationId: cgiGetDatasetInfo
      tags:
      - Datasets
      summary: Return metadata for a single dataset
      description: 'Prints the serialized geardb.Dataset. No login or visibility check. Quirk: an unknown dataset_id
        prints the literal text None (not valid JSON).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                dataset_id:
                  type: string
                include_shape:
                  type: string
                  description: Any non-empty value adds gene_count/obs_count
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1Dataset'
  /cgi/get_dataset_list.cgi:
    post:
      operationId: cgiGetDatasetList
      tags:
      - Datasets
      summary: Return datasets for a permalink, layout, search scope, or default layout
      description: Priority is permalink_share_id, then layout_share_id, then a search (scope, optional search_terms
        full-text + tag match), then the user's current layout, then the domain default layout. only_types and order=alpha
        post-filter/sort. session_id is optional. An unknown layout or scope raises (empty/500 response).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                permalink_share_id:
                  type: string
                  description: Return just this dataset (flagged is_permalink)
                layout_share_id:
                  type: string
                  description: Return this layout's datasets
                scope:
                  type: string
                  enum:
                  - self
                  - others
                  - shared
                  - user_all
                  description: Search scope
                search_terms:
                  type: string
                  description: Full-text terms (characters + - / @ are stripped)
                only_types:
                  type: string
                  description: Comma-separated dtypes to keep
                order:
                  type: string
                  enum:
                  - default
                  - alpha
                default_domain:
                  type: string
                  description: Domain label, e.g. "Brain development (default)"; else hearing layout
      responses:
        '200':
          description: Dataset list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Dataset'
  /cgi/get_default_display.cgi:
    post:
      operationId: cgiGetDefaultDisplay
      tags:
      - Displays
      summary: Get the default display ID for a dataset
      description: Returns the user's default display, falling back to the dataset owner's default. session_id is
        optional.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                dataset_id:
                  type: string
                session_id:
                  type: string
                is_multigene:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
      responses:
        '200':
          description: Default display ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_display_id:
                    type: integer
                    nullable: true
  /cgi/get_embedded_tsne_display.cgi:
    post:
      operationId: cgiGetEmbeddedTsneDisplay
      tags:
      - Displays
      summary: Build a tSNE plotly_config from columns embedded in the dataset
      description: Inspects the primary analysis obs columns for a known cluster column and tSNE coordinate pair
        and returns them as if they were a stored plotly_config (values null if not found). Errors return {error}
        with HTTP 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - dataset_id
              properties:
                dataset_id:
                  type: string
      responses:
        '200':
          description: plotly_config or error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plotly_config:
                    type: object
                    properties:
                      colorize_legend_by:
                        type: string
                        nullable: true
                      x_axis:
                        type: string
                        nullable: true
                      y_axis:
                        type: string
                        nullable: true
                  error:
                    type: string
  /cgi/get_event_registration_list.cgi:
    post:
      operationId: cgiGetEventRegistrationList
