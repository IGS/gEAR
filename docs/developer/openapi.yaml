                min_event_id:
                  type: integer
                max_event_id:
                  type: integer
      responses:
        '200':
          description: Map of event ID to status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    attendees:
                      type: integer
                    max_attendees:
                      type: integer
                    waitlist_size:
                      type: integer
                    user_attending:
                      type: integer
                      enum:
                      - 0
                      - 1
                    user_waitlisted:
                      type: integer
                      enum:
                      - 0
                      - 1
  /cgi/get_gene_cart_members.cgi:
    post:
      operationId: cgiGetGeneCartMembers
      tags:
