      summary: Return the gene symbols in a gene cart
      description: Unweighted carts are read from gene_cart_member; weighted carts from carts/cart.<share_id>.tab.
        session_id is read but not used for access control. Labeled lists and unknown carts raise after the header
        is printed (empty body).
      requestBody:
        required: true
        content:
