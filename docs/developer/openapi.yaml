# OpenAPI description of the gEAR REST API (/api) and CGI scripts (/cgi).
# Generated from the code; edit alongside the handlers when routes or parameters change.
openapi: 3.0.3
info:
  title: gEAR web API and CGI endpoints
  version: '2026.09'
  description: 'HTTP endpoints of the gene Expression Analysis Resource (gEAR).


    There are two families:


    - **REST API** (`/api/...`): a Flask-RESTful app (`www/api/api.py`) served through Apache mod_wsgi. The session
    is read from the `gear_session_id` cookie.

    - **CGI scripts** (`/cgi/...`): Python scripts in `www/cgi/` run directly by Apache. They read parameters with
    `cgi.FieldStorage()`, so every parameter can be sent either in the query string (GET) or as a form body (POST,
    usually `multipart/form-data` from the frontend). The session is passed as a `session_id` parameter. Most CGIs
    return HTTP 200 even on errors and report failure in the body (for example `success: 0` with a `message`).


    Generated from the code in September 2026; see docs/developer/api_reference.md for prose notes.'
servers:
- url: https://umgear.org
  description: UMgEAR (hearing research)
- url: https://nemoanalytics.org
  description: NeMO Analytics (brain research)
- url: http://localhost
  description: Local development server
tags:
- name: Plots
  description: 'REST: plot data for dataset displays'
- name: H5AD
  description: 'REST: dataset metadata, genes and aggregations'
- name: Projection
  description: Pattern projection (projectR)
- name: Import
  description: 'REST: upload processing status and track hub import'
- name: Analysis
  description: 'REST: analysis helpers'
- name: Displays
  description: Saved dataset displays
- name: HiGlass
  description: 'REST: HiGlass gene lookup'
- name: Account/auth
  description: 'CGI: accounts, login and sessions'
- name: Datasets
  description: 'CGI: dataset information and management'
- name: Collections (layouts)
  description: 'CGI: dataset collections (called layouts in the code)'
- name: Gene lists (carts)
  description: 'CGI: gene lists (called gene carts in the code)'
- name: Analysis/workbench
  description: 'CGI: Single Cell Workbench and analyses'
- name: Uploads
  description: 'CGI: dataset uploader'
- name: Search
  description: 'CGI: search'
- name: Misc
  description: 'CGI: everything else'
paths:
  /api/analysis/plotTopGenesPCA:
    post:
      operationId: plotTopGenesPca
      tags:
      - Analysis
      summary: Save a PCA loadings plot for selected principal components.
      description: Runs scanpy.pl.pca_loadings for the requested components and saves the PNG into the figures/
        directory next to the analysis h5ad (the image is not returned). The session ID comes from the session_id
        form field, not the cookie. Called by the single-cell workbench (www/js/classes/analysis.js).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiTopPcaGenesForm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiTopPcaGenesForm'
      responses:
        '200':
          description: '{"success": 1} on success. Validation errors return success 0 ("Number of PCs must between
            2 and 5", "Missing dataset_id", "Invalid dataset_id"); load or plot errors return success -1 with the
            exception text.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - -1
                    - 0
                    - 1
                    description: 1 success, 0 validation error, -1 load/plot error.
                  message:
                    type: string
                    description: Present on errors only.
        '500':
          description: Unhandled exception (e.g. missing pcs field, non-integer PC, analysis lookup failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/displays/{display_id}:
    get:
      operationId: getDatasetDisplay
      tags:
      - Displays
      summary: Fetch a saved dataset display configuration.
      description: Returns the dataset_display row from geardb.get_display_by_id. Does not read the session cookie
        and performs no access check. No front-end caller was found in www/js.
      parameters:
      - name: display_id
        in: path
        required: true
        description: Display ID.
        schema:
          type: string
      responses:
        '200':
          description: Display record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Display ID.
                  dataset_id:
                    type: string
                    description: Dataset ID.
                  user_id:
                    type: integer
                    description: Owner user ID.
                  label:
                    type: string
                    description: Display label.
                  plot_type:
                    type: string
                    description: Plot type.
                  plotly_config:
                    type: object
                    additionalProperties: true
                    description: Parsed plot configuration.
        '404':
          description: Display not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Display not found
  /api/h5ad/{dataset_id}:
    get:
      operationId: getH5adInfo
      tags:
      - H5AD
      summary: Describe a dataset's observation metadata (columns, category levels, counts).
      description: Loads an AnnDataShadow (or a spatial AnnData for spatial datasets) and returns obs column names,
        categorical levels and a replicate flag. Called by apiCallsMixin.fetchH5adInfo in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      - name: analysis_id
        in: query
        required: false
        description: Analysis ID; omit to use the primary dataset.
        schema:
          type: string
      responses:
        '200':
          description: Observation metadata summary. Errors return HTTP 200 with success -1 ("No dataset found with
            that ID", "No dataset file found.", or the exception text).
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    num_obs:
                      type: integer
                      description: Number of observations.
                    obs_columns:
                      type: array
                      items:
                        type: string
                      description: obs columns, plus X_tsne_1/2, X_umap_1/2, X_pca_1/2 when present in obsm; excludes
                        replicate, BioRep, TechRep and time_point_order.
                    obs_levels:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: Categorical columns with at most 50 levels (adds "NA" if nulls exist).
                    obs_levels_truncated:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: Categorical columns with more than 50 levels.
                    has_replicates:
                      type: integer
                      enum:
                      - 0
                      - 1
                      description: 1 if a replicate, BioRep or TechRep column exists.
                - $ref: '#/components/schemas/ApiErrorResponse'
  /api/h5ad/{dataset_id}/aggregations:
    post:
      operationId: getAggregations
      tags:
      - H5AD
      summary: Count observations per category for each categorical obs column, optionally filtered.
      description: Returns per-category counts for every categorical obs column (excluding replicate and *_colors).
        Categories with zero observations are kept and "nan" is renamed "Data not available". Filters on non-categorical
        columns are ignored. Called by apiCallsMixin.fetchAggregations in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis_id:
                  type: string
                  description: Analysis ID; omit for the primary dataset.
                filters:
                  $ref: '#/components/schemas/ApiObsFilters'
      responses:
        '200':
          description: 'Aggregations. Errors return HTTP 200 with success -1 ("No dataset found with that ID", "No
            dataset file found.", or the exception text; the latter two include aggregations: []).'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    aggregations:
                      type: array
                      description: One entry per categorical obs column.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Column name.
                          count:
                            type: integer
                            description: Non-null observations in the column (after filtering).
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Category value.
                                count:
                                  type: integer
                                  description: Observations with this value.
                    total_count:
                      type: integer
                      description: Number of observations after filtering.
                - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: reqparse type validation failure (e.g. filters not an object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReqparseError'
  /api/h5ad/{dataset_id}/analyses:
    get:
      operationId: getAnalyses
      tags:
      - H5AD
      summary: List public and user-saved analyses for a dataset that have tSNE or UMAP computed.
      description: Uses AnalysisCollection.get_all_by_dataset_id and keeps analyses whose tsne_calculated or umap_calculated
        flag is 1. private is empty for anonymous users. Called by apiCallsMixin.fetchAnalyses in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      responses:
        '200':
          description: Analyses (each serialized from the Analysis object's __dict__). Returns HTTP 200 with success
            -1 "No dataset found with that ID" for an unknown dataset.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    public:
                      type: array
                      description: Public analyses with tSNE/UMAP.
                      items:
                        $ref: '#/components/schemas/ApiAnalysis'
                    private:
                      type: array
                      description: The user's saved analyses with tSNE/UMAP.
                      items:
                        $ref: '#/components/schemas/ApiAnalysis'
                - $ref: '#/components/schemas/ApiErrorResponse'
  /api/h5ad/{dataset_id}/availableDisplayTypes:
    post:
      operationId: getAvailableDisplayTypes
      tags:
      - H5AD
      summary: Determine which single-gene plot types can be drawn for a dataset.
      description: 'Returns a flat map of display type to boolean based on obs column dtypes, obsm embeddings and
        whether datasets_uploaded/{dataset_id}.svg exists. Quirk: the path dataset_id is ignored; the handler reads
        dataset_id (and session_id) from the JSON body, so the body must repeat it. The session cookie is not read.
        Called by apiCallsMixin.fetchAvailablePlotTypes in www/js/common.v2.js.'
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID (ignored; the body value is used).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiDisplayTypesRequest'
      responses:
        '200':
          description: 'Flat availability map (no success key). Errors return HTTP 200 with success -1: dataset
            not found, file not found, exception text, or no obs columns (unless the dataset is svg-expression with
            an uploaded SVG, in which case the map is returned).'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    scatter:
                      type: boolean
                      description: Always true.
                    tsne_static:
                      type: boolean
                    umap_static:
                      type: boolean
                    pca_static:
                      type: boolean
                    tsne/umap_dynamic:
                      type: boolean
                    bar:
                      type: boolean
                    violin:
                      type: boolean
                    line:
                      type: boolean
                      description: True if any numeric column or a time_point column exists.
                    svg:
                      type: boolean
                      description: True if an uploaded SVG exists.
                - $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unhandled exception (e.g. no JSON body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/h5ad/{dataset_id}/genes:
    get:
      operationId: getGeneSymbols
      tags:
      - H5AD
      summary: List all gene symbols in a dataset or analysis.
      description: Returns var.gene_symbol as strings (NaN filled with "None") from the dataset or the given analysis.
        Called by apiCallsMixin.fetchGeneSymbols in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      - name: analysis
        in: query
        required: false
        description: Analysis ID; omit for the primary dataset.
        schema:
          type: string
      responses:
        '200':
          description: Gene symbols. Errors return HTTP 200 with success -1 ("No dataset found with that ID", "No
            file found for this dataset", or the exception text).
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    gene_symbols:
                      type: array
                      items:
                        type: string
                      description: All gene symbols in var.
                - $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unhandled exception (e.g. var has no gene_symbol column).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/h5ad/{dataset_id}/mg_availableDisplayTypes:
    post:
      operationId: getMgAvailableDisplayTypes
      tags:
      - H5AD
      summary: Determine which multi-gene plot types can be drawn for a dataset.
      description: 'Returns a flat map of multi-gene display type to boolean. volcano needs at least 2 categorical
        obs columns, quadrant at least 3; the static embeddings depend on obsm or two numeric columns. Quirk: like
        availableDisplayTypes, dataset_id and session_id come from the JSON body and the path segment is ignored.
        Called by apiCallsMixin.fetchAvailablePlotTypes in www/js/common.v2.js.'
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID (ignored; the body value is used).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiDisplayTypesRequest'
      responses:
        '200':
          description: 'Flat availability map (no success key). Errors return HTTP 200 with success -1: dataset
            not found, file not found, exception text, or no categorical columns.'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    dotplot:
                      type: boolean
                    heatmap:
                      type: boolean
                    mg_violin:
                      type: boolean
                    volcano:
                      type: boolean
                    quadrant:
                      type: boolean
                    mg_pca_static:
                      type: boolean
                    mg_tsne_static:
                      type: boolean
                    mg_umap_static:
                      type: boolean
                - $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unhandled exception (e.g. no JSON body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/h5ad/{dataset_id}/orthologs:
    post:
      operationId: getOrthologs
      tags:
      - H5AD
      summary: Map gene symbols to the symbols present in a dataset, using orthology when needed.
      description: Maps each input symbol directly (case-insensitive, same organism) or via Ensembl ortholog files
        for the gene and dataset organisms, with a final direct-match fallback. Wrapped in @catch_memory_error.
        Called by apiCallsMixin.fetchOrthologs in www/js/common.v2.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: dataset_id
        in: path
        required: true
        description: Dataset ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gene_symbols
              properties:
                gene_symbols:
                  type: array
                  items:
                    type: string
                  description: Gene symbols to map.
                analysis:
                  type: object
                  nullable: true
                  description: Analysis object; only its id is used. Must be an object (a string raises and returns
                    500).
                  properties:
                    id:
                      type: string
                  additionalProperties: true
                gene_organism_id:
                  type: integer
                  description: Organism ID of the input genes (cast with int()).
                exclusive_org:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  default: 'false'
                  description: '"true" restricts mapping to the gene organism''s ortholog file. Must be a string
                    (the handler calls .lower(); a JSON boolean causes a 500).'
      responses:
        '200':
          description: Mapping of each input symbol to matching dataset symbols (empty list if unmapped).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Always 1.
                  mapping:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    description: Input symbol to list of dataset gene symbols.
        '400':
          description: '{"error": ...} for invalid/empty JSON body, no gene symbols, dataset not found, or dataset
            without an organism; {"success": -1, "message": ...} when the dataset file cannot be loaded or lacks
            a gene_symbol column.'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: string
                      description: Error message.
                - $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: MemoryError or unhandled exception (e.g. exclusive_org mapping failure re-raised).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiMemoryErrorResponse'
                - $ref: '#/components/schemas/ApiMessageError'
  /api/h5ad/{share_uid}/availableAnalysisTools:
    get:
      operationId: getAvailableAnalysisTools
      tags:
      - H5AD
      summary: Report which gEAR analysis tools support a dataset's type.
      description: Looks up the dataset type by share ID and maps each tool in the module-level `tools` table to
        a boolean. Does not read the session cookie. Called by apiCallsMixin.fetchAvailableAnalysisTools in www/js/common.v2.js.
      parameters:
      - name: share_uid
        in: path
        required: true
        description: Dataset share ID.
        schema:
          type: string
      responses:
        '200':
          description: Tool availability. Returns HTTP 200 with success -1 and "No dataset found with that share
            ID" if the share ID is unknown.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success:
                      type: integer
                      description: 1 on success.
                    share_id:
                      type: string
                      description: The share ID from the path.
                    available_analysis_tools:
                      type: object
                      description: Tool name to availability.
                      properties:
                        dataset-curator:
                          type: boolean
                        multigene-viewer:
                          type: boolean
                        compare-tool:
                          type: boolean
                        sc-workbench:
                          type: boolean
                - $ref: '#/components/schemas/ApiErrorResponse'
  /api/higlass/genes/{gene_symbol}:
    get:
      operationId: getHiGlassGene
      tags:
      - HiGlass
      summary: Look up a gene's coordinates on the gEAR HiGlass server.
      description: Queries <HIGLASS_URL>/suggest/ for the assembly's annotation BEDdb tileset and returns the matching
        entry unchanged, preferring an exact case-insensitive geneName match and falling back to the first hit.
        Called by apiCallsMixin.fetchHiglassGeneCoords in www/js/common.v2.js and internally by GoslingSpec via
        http://127.0.0.1/api/higlass/genes/.
      parameters:
      - name: gene_symbol
        in: path
        required: true
        description: Gene symbol to search.
        schema:
          type: string
      - name: assembly
        in: query
        required: true
        description: Assembly key of ANNOTATION_BEDDB_UID in resources/common.py.
        schema:
          type: string
          enum:
          - danRer10
          - hg19
          - hg38
          - mm10
          - mm39
          - rn6
      responses:
        '200':
          description: The HiGlass suggest entry, or JSON null when HiGlass returns no results or the request to
            HiGlass fails.
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  chr:
                    type: string
                    description: Chromosome.
                  txStart:
                    type: integer
                    description: Transcript start.
                  txEnd:
                    type: integer
                    description: Transcript end.
                  score:
                    type: number
                    description: HiGlass suggest score.
                  geneName:
                    type: string
                    description: Official gene name.
                additionalProperties: true
        '500':
          description: Unsupported or missing assembly (the handler raises ValueError).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageError'
  /api/import/dataset/{share_uid}/status:
    post:
      operationId: getDatasetProcessingStatus
      tags:
      - Import
      summary: Poll the processing status of a dataset upload (expression, spatial or track hub).
      description: Returns the staging status.json for the user's upload. While status is "processing" (and dataset_format
        is not "gosling") it checks for a recorded job_id, falling back to checking that the legacy process_id is
        alive with `ps -p`. Uses POST although it only reads. The body should be JSON (the client sends a JSON object
        so Flask does not treat it as form data). Called by www/js/upload_dataset.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: share_uid
        in: path
        required: true
        description: Upload share UID.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dataset_format:
                  type: string
                  description: Upload format, e.g. "expression", "spatial" or "gosling" ("gosling" skips the liveness
                    check).
      responses:
        '200':
          description: Contents of status.json; progress is set to 100 when status is "complete".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUploadStatus'
        '400':
          description: Status was "processing" but neither a job_id nor a live process_id was found; the returned
            status.json copy has status "error", progress 0 and a failure message (the file is not updated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUploadStatus'
        '401':
          description: Session cookie does not resolve to a user ("Invalid session").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUploadStatusError'
        '404':
          description: status.json not found ("Job status file not found").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUploadStatusError'
  /api/import/trackhub/{share_uid}/copy:
    post:
      operationId: copyTrackHub
      tags:
      - Import
      summary: Import an uploaded UCSC track hub as a Gosling-format dataset.
      description: Saves uploaded track files into www/uploads/files/{session_id}/{share_uid}/, writes status.json,
        sets dataset_format "gosling" in the staging metadata.json and builds hub_url as <domain>/tracks/<dataset_uid>.
        Publishes to RabbitMQ queue "trackhub_copy_jobs" when [dataset_uploader] queue_enabled, otherwise runs gear.trackhub.process_trackhub_synchronously.
        Called by www/js/upload_dataset.js.
      security:
      - gearSessionCookie: []
      parameters:
      - name: share_uid
        in: path
        required: true
        description: Upload share UID (staging directory name).
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - hub_json
              - tracks
              - assembly
              properties:
                hub_json:
                  type: string
                  description: JSON-encoded hub stanza. Invalid JSON causes a 500.
                tracks:
                  type: string
                  description: JSON-encoded list of track stanzas; each should have an "id".
                assembly:
                  type: string
                  description: Genome assembly.
                dry_run:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: '"true" skips saving uploaded files.'
              additionalProperties:
                type: string
                format: binary
                description: Optional track files under keys containing "[<track_id>][file]"; the filename is recorded
                  on the matching stanza as uploadedFileName.
      responses:
        '200':
          description: 'Synchronous processing succeeded. Quirk: if the staging metadata.json is missing or has
            no dataset_uid, the handler writes an error status.json and returns with no value, so the body is JSON
            null with HTTP 200.'
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                - $ref: '#/components/schemas/ApiTrackHubCopyResult'
        '202':
          description: Job queued to RabbitMQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTrackHubCopyResult'
        '400':
          description: Missing hub_json, tracks, or (after the session check) assembly/empty track list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTrackHubCopyResult'
        '401':
          description: Session cookie does not resolve to a user ("Invalid session. Please log in.").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTrackHubCopyResult'
        '500':
          description: 'Domain URL not configured, synchronous processing failed, queue connection/publish error
            ("Error processing track hub: ..."), or an unhandled exception such as invalid hub_json.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiTrackHubCopyResult'
                - $ref: '#/components/schemas/ApiMessageError'
  /api/plot/{dataset_id}:
