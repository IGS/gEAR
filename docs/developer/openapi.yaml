              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
                num_entries:
                  type: integer
                  default: 5
      responses:
        '200':
          description: History entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    entry_date:
                      type: string
                    entry_category:
                      type: string
                    label:
                      type: string
                    url:
                      type: string
  /cgi/get_user_layouts.cgi:
    post:
      operationId: cgiGetUserLayouts
      tags:
      - Collections (layouts)
      summary: Return layouts (collections) visible to the user, grouped by category
      description: Public (and, unless no_domain=1, domain) layouts are always returned; user and group layouts
        only for a logged-in session; shared_layouts for layout_share_id (deduplicated). 'selected' is the passed
        share ID, else the user's current layout, else the current domain layout. Each layout gets is_owner, and
        its id and user_id are removed. 'folders' is always empty.
      requestBody:
