            schema:
              type: object
              required:
              - share_id
              properties:
                share_id:
                  type: string
                  description: Gene cart share ID
                session_id:
                  type: string
                  description: Unused
      responses:
        '200':
          description: Gene cart members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  gene_symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Member ID (int) or Ensembl ID (weighted)
                        label:
                          type: string
                          description: Gene symbol
