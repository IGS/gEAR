                session_id:
                  type: string
                layout_share_id:
                  type: string
                no_domain:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                include_members:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 1
                  description: Include member datasets
      responses:
        '200':
          description: Layout categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Layout'
                  domain_layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Layout'
                  group_layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Layout'
                  shared_layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Layout'
                  public_layouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi1Layout'
                  folders:
                    type: array
                    items: {}
                    description: Always empty
                  selected:
                    type: string
                    nullable: true
                    description: Share ID of the selected layout
  /cgi/get_users_layout_members.cgi:
    post:
      operationId: cgiGetUsersLayoutMembers
      tags:
      - Collections (layouts)
      summary: Return the single- and multi-gene display members of a layout
      description: Defaults to gear.ini content.default_layout_share_id if no share ID is given. No privacy check
        (a shared layout overrides privacy). Unknown layouts return a message with HTTP 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                layout_share_id:
                  type: string
                session_id:
                  type: string
                  description: Optional; used only to compute is_owner
      responses:
        '200':
          description: Layout members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout_members:
                    type: object
                    properties:
                      single:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cgi1LayoutMember'
                      multi:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cgi1LayoutMember'
                  message:
                    type: string
                    nullable: true
                    description: Set when the layout is not found
                  is_owner:
                    type: boolean
                  is_public:
                    description: Layout is_public value (false if not public)
  /cgi/get_weighted_gene_cart_preview.cgi:
    post:
      operationId: cgiGetWeightedGeneCartPreview
      tags:
      - Gene lists (carts)
      summary: Summarize a weighted gene cart (gene count and weight labels)
      description: Opens carts/cart.<share_id>.h5ad (share_id reduced to letters and digits). preview_json is always
        empty (the preview table is commented out). An unreadable file returns success -1 with HTTP 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - share_id
              properties:
                share_id:
                  type: string
                  description: Gene cart share ID
      responses:
        '200':
          description: Summary or error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - -1
                    - 0
                    - 1
                  message:
                    type: string
                  num_genes:
                    type: integer
                  weights:
                    type: array
                    items:
                      type: string
                    description: Weight (obs) labels
                  preview_json:
                    type: array
                    items: {}
                    description: Always empty
  /cgi/h5ad_apply_primary_filter.cgi:
    post:
      operationId: cgiH5adApplyPrimaryFilter
      tags:
      - Analysis/workbench
      summary: Apply cell/gene count filters to a primary H5AD analysis
      description: Filters cells by gene counts and genes by cell counts, writes the result as a new `user_unsaved`
        analysis (session-specific copy) and renders a highest-expressed-genes plot. Only works on a `primary` analysis;
        any other analysis type raises an uncaught exception (server error, no JSON). session_id locates the per-session
        analysis directory; login is not checked.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                properties:
                  filter_cells_lt_n_genes:
                    type: integer
                    description: Keep cells with at least N genes (scanpy filter_cells min_genes).
                  filter_cells_gt_n_genes:
                    type: integer
                    description: Keep cells with at most N genes (max_genes).
                  filter_genes_lt_n_cells:
                    type: integer
                    description: Keep genes expressed in at least N cells (min_cells).
                  filter_genes_gt_n_cells:
                    type: integer
                    description: Keep genes expressed in at most N cells (max_cells).
      responses:
        '200':
          description: Filter result. Failures (missing dataset/analysis, plot failure) return success 0 with HTTP
            200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  n_obs:
                    type: integer
                    nullable: true
                    description: Cells remaining after filtering.
                  n_genes:
                    type: integer
                    nullable: true
                    description: Genes remaining after filtering.
  /cgi/h5ad_compare_genes.cgi:
    post:
      operationId: cgiH5adCompareGenes
      tags:
      - Analysis/workbench
      summary: Compare marker genes between a query cluster and a reference cluster
      description: Runs scanpy rank_genes_groups for the query cluster vs. a reference cluster (or all others),
        writes ranked/violin comparison PNGs next to the analysis file and, if a specific reference is given, also
        the reverse comparison. Primary/public analyses are redirected to a `user_unsaved` copy. Cluster column
        is `louvain` except for hard-coded BICCN dataset IDs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - n_genes
                - query_cluster
                - reference_cluster
                - method
                properties:
                  query_cluster:
                    type: string
                    description: Cluster label to test.
                  reference_cluster:
                    type: string
                    description: Cluster label to compare against, or `all-reference-clusters` for all others.
                  n_genes:
                    type: integer
                    description: Number of top genes to plot and return.
                  method:
                    type: string
                    description: scanpy rank_genes_groups method (frontend sends t-test, t-test_overestim_var, wilcoxon,
                      logreg). logreg is rejected with `all-reference-clusters`.
                  corr_method:
                    type: string
                    description: p-value correction (frontend sends benjamini-hochberg or bonferroni). Ignored for
                      logreg.
                  group_labels:
                    type: string
                    description: Optional JSON array of new category names applied to the cluster column before
                      ranking.
      responses:
        '200':
          description: Comparison tables. Errors return success 0 (and sometimes `error`) with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  cluster_label:
                    type: string
                    description: obs column used for clusters.
                  table_json_f:
                    type: string
                    nullable: true
                    description: Forward comparison as a pandas DataFrame JSON string (orient=split; columns names,
                      log2FC, P-value, FDR). Null for logreg.
                  table_json_r:
                    type: string
                    nullable: true
                    description: Reverse comparison (reference vs. query) in the same format. Null for logreg; when
                      reference is `all-reference-clusters` it repeats the forward table.
                  error:
                    type: string
                    description: Present only for the logreg/all-reference-clusters error.
  /cgi/h5ad_find_marker_genes.cgi:
    post:
      operationId: cgiH5adFindMarkerGenes
      tags:
      - Analysis/workbench
      summary: Rank marker genes per cluster and return the top-gene table
      description: Optionally recomputes scanpy rank_genes_groups (and plots it) on the cluster column, then returns
        the top N marker gene symbols per cluster plus per-cluster cell counts. Primary/public analyses are redirected
        to a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - n_genes
                properties:
                  n_genes:
                    type: integer
                    description: Number of top genes per cluster.
                  compute_marker_genes:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: '`true` to recompute and save rankings; otherwise existing rankings in the file
                      are read.'
      responses:
        '200':
          description: Marker gene table. Missing dataset/analysis returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  table:
                    type: object
                    description: '{columns: [{label}], rows: [{rowid, columns: [{label: gene_symbol}]}]}'
                    additionalProperties: true
                  group_labels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cgi2GroupLabel'
                  cluster_label:
                    type: string
                    description: obs column used for clusters.
  /cgi/h5ad_generate_clusters.cgi:
    post:
      operationId: cgiH5adGenerateClusters
      tags:
      - Analysis/workbench
      summary: Run Leiden/Louvain clustering and rename, merge or drop clusters
      description: When compute_clusters is `true`, runs Leiden (falls back to Louvain) and stores results in the
        `louvain` column. cluster_info then relabels (duplicate labels merge) and filters clusters, and tSNE/UMAP
        clustering plots are written. Primary/public analyses are redirected to a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - resolution
                - cluster_info
                - plot_tsne
                - plot_umap
                properties:
                  resolution:
                    type: number
                    description: Clustering resolution.
                  compute_clusters:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: '`true` to (re)run clustering.'
                  cluster_info:
                    type: string
                    description: JSON array of {old_label, new_label, keep}; `[]` to skip relabeling.
                  plot_tsne:
                    type: integer
                    enum:
                    - 0
                    - 1
                  plot_umap:
                    type: integer
                    enum:
                    - 0
                    - 1
      responses:
        '200':
          description: Cluster labels. Missing dataset/analysis returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  group_labels:
                    type: array
                    description: Relabeled clusters (empty when cluster_info is empty; empty string on early failure).
                    items:
                      $ref: '#/components/schemas/Cgi2GroupLabel'
  /cgi/h5ad_generate_marker_gene_visualization.cgi:
    post:
      operationId: cgiH5adGenerateMarkerGeneVisualization
      tags:
      - Analysis/workbench
      summary: Plot a dotplot and stacked violin for chosen marker genes
      description: Writes dotplot and stacked-violin `goi.png` images for the given genes (case-insensitive match,
        unknown genes silently dropped) grouped by the cluster column. Primary/public analyses write into a `user_unsaved`
        directory.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - marker_genes
                properties:
                  marker_genes:
                    type: string
                    description: JSON array of gene symbols (empty strings ignored).
      responses:
        '200':
          description: Plot status. Missing dataset/analysis returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessInt'
  /cgi/h5ad_generate_pca.cgi:
    post:
      operationId: cgiH5adGeneratePca
      tags:
      - Analysis/workbench
      summary: Compute and plot PCA and the PCA variance ratio
      description: Optionally computes PCA (arpack, sign-flipped to match Seurat) and saves it, then writes a PCA
        plot (optionally colored by genes) and a variance-ratio plot. Primary/public analyses are redirected to
        a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                properties:
                  compute_pca:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: '`true` to compute and save PCA; otherwise the stored PCA is plotted.'
                  genes_to_color:
                    type: string
                    description: Optional comma-separated gene symbols to color the PCA plot by.
      responses:
        '200':
          description: Plot status. An unknown coloring gene returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2MissingGeneResult'
  /cgi/h5ad_generate_tsne.cgi:
    post:
      operationId: cgiH5adGenerateTsne
      tags:
      - Analysis/workbench
      summary: Compute neighbors, tSNE and UMAP and render the requested plots
      description: Runs the requested steps (neighbors, tSNE, UMAP), saves the analysis if any ran, and writes tSNE/UMAP
        PNGs optionally colored by genes. All integer flags are required (int() on missing values fails). Primary/public
        analyses are redirected to a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - n_pcs
                - n_neighbors
                - random_state
                - compute_neighbors
                - compute_tsne
                - compute_umap
                - plot_tsne
                - plot_umap
                properties:
                  n_pcs:
                    type: integer
                    description: Number of principal components to use.
                  n_neighbors:
                    type: integer
                    description: Neighborhood size for sc.pp.neighbors.
                  random_state:
                    type: integer
                    description: tSNE random seed.
                  genes_to_color:
                    type: string
                    description: Optional comma-separated gene symbols to color by.
                  use_scaled:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: '`true` plots from adata.X instead of adata.raw.'
                  compute_neighbors:
                    type: integer
                    enum:
                    - 0
                    - 1
                  compute_tsne:
                    type: integer
                    enum:
                    - 0
                    - 1
                  compute_umap:
                    type: integer
                    enum:
                    - 0
                    - 1
                  plot_tsne:
                    type: integer
                    enum:
                    - 0
                    - 1
                  plot_umap:
                    type: integer
                    enum:
                    - 0
                    - 1
      responses:
        '200':
          description: Plot status. An unknown coloring gene returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2MissingGeneResult'
  /cgi/h5ad_identify_variable_genes.cgi:
    post:
      operationId: cgiH5adIdentifyVariableGenes
      tags:
      - Analysis/workbench
      summary: Normalize, log-transform and flag highly variable genes
      description: Normalizes totals, applies log1p, runs highly_variable_genes (by n_top_genes if given, otherwise
        by mean/dispersion cutoffs) and plots it. With save_dataset=1 it optionally regresses out n_counts/percent_mito,
        scales, and saves. Primary/public analyses are redirected to a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - norm_counts_per_cell
                - flavor
                - min_mean
                - max_mean
                - min_dispersion
                - save_dataset
                properties:
                  norm_counts_per_cell:
                    type: number
                    description: target_sum for sc.pp.normalize_total.
                  flavor:
                    type: string
                    description: highly_variable_genes flavor (frontend offers seurat, cell_ranger).
                  n_top_genes:
                    type: integer
                    description: Optional; if set, overrides the mean/dispersion cutoffs.
                  min_mean:
                    type: number
                  max_mean:
                    type: number
                  min_dispersion:
                    type: number
                  regress_out:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: Regress out n_counts and percent_mito (only when save_dataset=1).
                  scale_unit_variance:
                    type: string
                    enum:
                    - 'true'
                    - 'false'
                    description: Scale to unit variance, max 10 (only when save_dataset=1).
                  save_dataset:
                    type: integer
                    enum:
                    - 0
                    - 1
      responses:
        '200':
          description: Variable-gene summary. Missing dataset/analysis returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  n_obs:
                    type: integer
                    description: Cell count.
                  n_genes:
                    type: integer
                    description: Number of highly variable genes.
                  top_genes:
                    type: string
                    description: Comma-separated top 5 genes by normalized dispersion.
  /cgi/h5ad_preview_primary_filter.cgi:
    post:
      operationId: cgiH5adPreviewPrimaryFilter
      tags:
      - Analysis/workbench
      summary: Check that pre-generated pre-filter composition plots exist
      description: No longer generates plots; only checks for the `.prelim_violin.png` created offline by bin/generate_initial_composition_plots.py
        and returns success 1 if present.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi2AnalysisForm'
      responses:
        '200':
          description: Presence check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                    description: 1 if the preliminary violin image exists.
                  is_spatial:
                    type: integer
                    enum:
                    - 0
                    - 1
                    description: Omitted if the dataset was not found.
  /cgi/h5ad_qc_by_mito.cgi:
    post:
      operationId: cgiH5adQcByMito
      tags:
      - Analysis/workbench
      summary: QC cells by mitochondrial gene content and optionally filter
      description: Computes percent_mito and n_counts per cell for genes matching a prefix (case-insensitive), writes
        violin and scatter QC plots, and with save_dataset=1 filters by n_genes and percent_mito and saves. Primary/public
        analyses are redirected to a `user_unsaved` copy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/Cgi2AnalysisForm'
              - type: object
                required:
                - genes_prefix
                - save_dataset
                properties:
                  genes_prefix:
                    type: string
                    description: Mitochondrial gene symbol prefix, e.g. `mt-`.
                  filter_mito_perc:
                    type: number
                    description: Keep cells with percent_mito below this fraction.
                  filter_mito_count:
                    type: integer
                    description: Keep cells with n_genes below this value.
                  save_dataset:
                    type: integer
                    enum:
                    - 0
                    - 1
      responses:
        '200':
          description: QC result. Missing dataset/analysis returns success 0 with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  n_obs:
                    type: integer
                    description: Only when save_dataset=1.
                  n_genes:
                    type: integer
                    description: Only when save_dataset=1.
  /cgi/load_comment.cgi:
    post:
      operationId: cgiLoadComment
      tags:
      - Misc
      summary: Store a user question/comment and its tags in the database
      description: Inserts a row into `comment` and links comma-space separated tags (creating new `tag` rows as
        needed). No login required; the security-check field is read but never validated. No frontend caller found
        (likely legacy).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                submitter_firstname:
                  type: string
                submitter_lastname:
                  type: string
                submitter_email:
                  type: string
                comment_title:
                  type: string
                comment:
                  type: string
                comment_tag:
                  type: string
                  description: Tags separated by ", ".
                super_impressive_security_check:
                  type: string
                  description: Read but unused.
      responses:
        '200':
          description: Always success 1 unless the DB insert raises.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessInt'
  /cgi/login.cgi:
    post:
      operationId: cgiLogin
      tags:
      - Account/auth
      summary: Log in with email/password and return a session_id (legacy)
      description: Checks the password against sha3-256 then legacy md5 hashes and returns the user's existing session
        or creates one. session_id is 0 if the email is unknown and -1 if the password is wrong (both HTTP 200).
        Legacy; used by js/common.js (contact.html) via jQuery form serialization.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi2LoginV1Form'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cgi2LoginV1Form'
      responses:
        '200':
          description: Login result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    oneOf:
                    - type: string
                    - type: integer
                      enum:
                      - 0
                      - -1
                    description: Session UUID, 0 (email not found) or -1 (wrong password).
                  is_admin:
                    type: integer
                    enum:
                    - 0
                    - 1
                  user_id:
                    type: integer
                    description: Only on success.
                  name:
                    type: string
                    description: User name; only on success.
                  gear_default_domain:
                    type: string
                    description: Current layout label (default "Hearing (site default)"); only on success.
  /cgi/login.v2.cgi:
    post:
      operationId: cgiLoginV2
      tags:
      - Account/auth
      summary: Log in (v2 field names) and return a session_id
      description: Same logic as login.cgi but reads hyphenated field names and also returns the current layout
        share ID. session_id is 0 if the email is unknown and -1 if the password is wrong (both HTTP 200). The v2
        frontend posts URLSearchParams (urlencoded).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cgi2LoginV2Form'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi2LoginV2Form'
      responses:
        '200':
          description: Login result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    oneOf:
                    - type: string
                    - type: integer
                      enum:
                      - 0
                      - -1
                    description: Session UUID, 0 (email not found) or -1 (wrong password).
                  is_admin:
                    type: integer
                    enum:
                    - 0
                    - 1
                  user_name:
                    type: string
                    description: Only on success.
                  gear_default_domain:
                    type: string
                    description: Current layout label (default "Hearing (site default)"); only on success.
                  default_profile_share_id:
                    oneOf:
                    - type: string
                    - type: integer
                    description: Current layout share_id, or 0 if none; only on success.
  /cgi/manage_dataset_shares.cgi:
    post:
      operationId: cgiManageDatasetShares
      tags:
      - Datasets
      summary: Share/unshare a dataset and list its share rows
      description: 'Requires a logged-in user who owns the dataset (unknown session raises an error). Sets dataset_shares.is_allowed,
        but only for the row matching the owner''s own user_id, and returns those rows. Quirk: the script prints
        the FieldStorage repr to stdout before the JSON, so the body is not valid JSON; no frontend caller found
        (likely broken/legacy).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - to_share
              properties:
                session_id:
                  type: string
                  description: Session of the dataset owner.
                dataset_id:
                  type: string
                to_share:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: 1 = share, 0 = unshare.
      responses:
        '200':
          description: Share list, or success 0 with error if the user does not own the dataset (HTTP 200). Body
            is preceded by a non-JSON FieldStorage dump.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  user_list:
                    type: array
                    items:
                      type: object
                      properties:
                        dataset_id:
                          type: string
                        user_id:
                          type: integer
                        user_name:
                          type: string
                        is_allowed:
                          type: integer
                  error:
                    type: string
  /cgi/mark_dataset_for_removal.cgi:
    post:
      operationId: cgiMarkDatasetForRemoval
      tags:
      - Datasets
      summary: Mark an owned dataset for removal by cron
      description: Requires a logged-in user who owns the dataset (an unknown session raises an error). Sets dataset.marked_for_removal
        = 1; actual deletion is done by a cron job. No frontend caller found (remove_dataset.cgi does the same soft
        delete).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi2SessionDatasetForm'
      responses:
        '200':
          description: Result; non-owners get success 0 with error (HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessError'
  /cgi/process_contact.py:
    post:
      operationId: cgiProcessContact
      tags:
      - Misc
      summary: Save a contact-form submission to a file
      description: Writes the submitted fields to a timestamped file under cgi/user-submitted-comments/ and returns
        an HTML confirmation. No login, no validation (security-check value is just recorded). No frontend caller
        found (legacy).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                submitterName:
                  type: string
                InputEmail:
                  type: string
                keep_updated:
                  type: string
                super_impressive_security_check:
                  type: string
                  description: Recorded, not validated.
                comments:
                  type: string
      responses:
        '200':
          description: HTML confirmation with a link back to the main site.
          content:
            text/html:
              schema:
                type: string
  /cgi/process_uploaded_expression_dataset.cgi:
    post:
      operationId: cgiProcessUploadedExpressionDataset
      tags:
      - Uploads
      summary: Queue (or synchronously run) processing of an uploaded expression dataset
      description: Requires a logged-in user. Validates the staged upload under uploads/files/<session_id>/<share_uid>,
        writes status.json, updates metadata.json (dataset_uid and dataset_type are read from it, not the form),
        and publishes a RabbitMQ job (anndata_upload_jobs or spatial_upload_jobs). If the queue is disabled in gear.ini
        it processes synchronously inside the CGI. Sets the HTTP status via a `Status:` header.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - share_uid
              - session_id
              - dataset_format
              properties:
                share_uid:
                  type: string
                  description: Upload share UID (sanitized with secure_filename).
                session_id:
                  type: string
                  description: Session of the uploading user (also names the staging directory).
                dataset_format:
                  type: string
                  enum:
                  - h5ad
                  - mex_3tab
                  - excel
                  - rds
                  - spatial
                spatial_format:
                  type: string
                  enum:
                  - cosmx
                  - curio
                  - geomx
                  - visium
                  - visium_hd
                  - visiumhd
                  - xenium
                  description: Required when dataset_format is `spatial`.
      responses:
        '200':
          description: Queue disabled; processed synchronously and succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
        '202':
          description: Job queued on RabbitMQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
        '400':
          description: Missing share_uid/session_id/dataset_format, unsupported format, invalid spatial format,
            or missing metadata.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
        '401':
          description: session_id does not map to a user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
        '404':
          description: Upload staging directory not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
        '500':
          description: Metadata read error, queue connection/publish error, or synchronous processing failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2UploadProcessResult'
  /cgi/remove_dataset.cgi:
    post:
      operationId: cgiRemoveDataset
      tags:
      - Datasets
      summary: Remove an owned dataset (soft delete)
      description: Requires a logged-in user who owns the dataset. Deletes the dataset's displays from all layouts,
        deletes its dataset_shares rows, and sets marked_for_removal = 1 (files removed later).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cgi2SessionDatasetForm'
      responses:
        '200':
          description: Result; non-owner or DB errors return success 0 with error (HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  dataset:
                    type: array
                    items: {}
                    description: Always empty on success.
                  error:
                    type: string
  /cgi/remove_dataset_from_layout.cgi:
    post:
      operationId: cgiRemoveDatasetFromLayout
      tags:
      - Collections (layouts)
      summary: Remove a dataset's displays from a layout
      description: 'Requires a logged-in user who owns the layout (collection). Quirks: an unknown layout_share_id
        raises an error (no JSON), and when not logged in the error JSON is printed twice. No frontend caller found.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - layout_share_id
              properties:
                session_id:
                  type: string
                dataset_id:
                  type: string
                layout_share_id:
                  type: string
      responses:
        '200':
          description: Result; errors return success 0 or only `error` (HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessError'
  /cgi/remove_display_from_layout.cgi:
    post:
      operationId: cgiRemoveDisplayFromLayout
      tags:
      - Collections (layouts)
      summary: Remove a display from a layout
      description: 'Requires a logged-in user who owns the layout (collection). Quirks: an unknown layout_share_id
        raises an error (no JSON), and when not logged in the error JSON is printed twice.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - display_id
              - layout_share_id
              properties:
                session_id:
                  type: string
                display_id:
                  type: string
                layout_share_id:
                  type: string
      responses:
        '200':
          description: Result; errors return success 0 or only `error` (HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessError'
  /cgi/remove_gene_cart.cgi:
    post:
      operationId: cgiRemoveGeneCart
      tags:
      - Gene lists (carts)
      summary: Delete an owned gene cart
      description: Requires a logged-in user who owns the gene cart identified by share_id; calls GeneCart.remove().
        The non-owner error message mistakenly says "dataset".
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_id
              properties:
                session_id:
                  type: string
                share_id:
                  type: string
                  description: Gene cart share ID.
      responses:
        '200':
          description: Result; invalid share_id or non-owner returns success 0 with error (HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  gc:
                    type: array
                    items: {}
                    description: Always empty on success.
                  error:
                    type: string
  /cgi/remove_layout.cgi:
    post:
      operationId: cgiRemoveLayout
      tags:
      - Collections (layouts)
      summary: Delete an owned layout
      description: Requires a logged-in user who owns the layout; refuses layout id 0 (site default). An unknown
        session or layout_share_id raises an error instead of returning JSON.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              properties:
                session_id:
                  type: string
                layout_share_id:
                  type: string
      responses:
        '200':
          description: Result; non-owner returns success 0 with error (HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi2SuccessError'
  /cgi/rename_layout.cgi:
    post:
      operationId: cgiRenameLayout
      tags:
      - Collections (layouts)
      summary: Rename a layout
      description: Requires a logged-in user who owns the layout. Sets the layout label and returns the new label
        and share ID.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              - layout_name
              properties:
                session_id:
                  type: string
                layout_share_id:
                  type: string
                layout_name:
                  type: string
                  description: New layout label.
      responses:
        '200':
          description: Renamed layout, or only `error` (not logged in / layout not found / not the owner) with HTTP
            200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout_label:
                    type: string
                  layout_share_id:
                    type: string
                  error:
                    type: string
  /cgi/save_dataset_analysis.cgi:
    post:
      operationId: cgiSaveDatasetAnalysis
      tags:
      - Analysis/workbench
      summary: Save the JSON state of an analysis pipeline
      description: 'Writes `state` verbatim to the analysis''s `<dataset_id>.pipeline.json` settings file (Analysis
        or SpatialAnalysis, depending on the dataset''s dtype). Requires a logged-in user (`session_id`). Errors
        are returned with HTTP 200 and `success: 0`; a missing dataset returns `success: 0` with an empty `error`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - analysis_id
              - analysis_type
              - state
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                dataset_id:
                  type: string
                  description: Dataset UUID.
                analysis_id:
                  type: string
                  description: Analysis UUID.
                analysis_type:
                  type: string
                  enum:
                  - primary
                  - public
                  - user_saved
                  - user_unsaved
                  description: Analysis type; determines where the settings file is written.
                analysis_vetting:
                  type: string
                  description: Vetting level; "undefined", "null" or empty are treated as none.
                state:
                  type: string
                  description: JSON-serialized pipeline state written to disk as-is.
                label:
                  type: string
                  description: Analysis label.
      responses:
        '200':
          description: Result of the save (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/save_dataset_display.cgi:
    post:
      operationId: cgiSaveDatasetDisplay
      tags:
      - Displays
      summary: Create or update a saved display and regenerate its static preview PNG
      description: Requires a logged-in user. With `id`, updates the display's label/plot_type/plotly_config only
        if the user owns it; without `id`, inserts a new display. Then POSTs the config to the local `/api/plot/<dataset_id>`
        endpoints (https, falling back to http) to write `img/dataset_previews/<dataset_id>.<display_id>.png`; image
        failures are only logged and do not change `success`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - plot_type
              - plotly_config
              properties:
                id:
                  type: string
                  description: Existing display ID to update; omit to create a new display.
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                dataset_id:
                  type: string
                  description: Dataset UUID.
                label:
                  type: string
                  description: Display label.
                plot_type:
                  type: string
                  description: Plot type, e.g. bar, scatter, violin, line, contour, tsne_dynamic, tsne/umap_dynamic,
                    mg_violin, dotplot, volcano, heatmap, quadrant, tsne_static, umap_static, pca_static, mg_tsne_static,
                    mg_umap_static, mg_pca_static, svg, gosling. Unrecognized types are saved but get no preview
                    image.
                plotly_config:
                  type: string
                  description: JSON string of the plot configuration.
                is_local:
                  type: string
                  description: If any non-empty value, render the preview via http://localhost instead of https.
      responses:
        '200':
          description: Result of the save (errors also use HTTP 200 with success false).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  display_id:
                    type: integer
                    nullable: true
                    description: ID of the saved display (absent if the new row could not be found after insert).
  /cgi/save_datasetinfo_changes.cgi:
    post:
      operationId: cgiSaveDatasetinfoChanges
      tags:
      - Datasets
      summary: Edit metadata of a dataset the user owns
      description: 'Requires a logged-in user who owns the dataset. Every field below is compared to the stored
        value and saved if different, so omitted fields are overwritten with null; send all of them. Errors use
        HTTP 200 and `success: 0`. An invalid session raises a server error (the user lookup is not checked).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in owner.
                dataset_id:
                  type: string
                  description: Dataset UUID.
                visibility:
                  type: string
                  description: Value saved to is_public (e.g. 0/1).
                is_downloadable:
                  type: string
                  description: Value saved to is_downloadable (e.g. 0/1).
                title:
                  type: string
                pubmed_id:
                  type: string
                geo_id:
                  type: string
                ldesc:
                  type: string
                  description: Long description.
      responses:
        '200':
          description: Updated dataset, or an error (HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  dataset:
                    type: object
                    additionalProperties: true
                    description: The dataset object (on success).
                  error:
                    type: string
                  owns_dataset:
                    type: boolean
                    description: Present (false) when the user does not own the dataset.
  /cgi/save_default_display.cgi:
    post:
      operationId: cgiSaveDefaultDisplay
      tags:
      - Displays
      summary: Set the user's default single- or multi-gene display for a dataset
      description: Requires a logged-in user (an invalid session raises a server error). Upserts `dataset_preference`.
        If the user is the dataset owner and the display's preview PNG exists, also (re)creates the `<dataset_id>.<single|multi>.default.png`
        symlink used as the dataset's preview image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - dataset_id
              - display_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                dataset_id:
                  type: string
                  description: Dataset UUID.
                display_id:
                  type: string
                  description: Display ID to make the default.
                is_multigene:
                  type: integer
                  enum:
                  - 0
                  - 1
                  default: 0
                  description: 1 for the multi-gene default.
      responses:
        '200':
          description: Result of the save.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /cgi/save_genecart_changes.cgi:
    post:
      operationId: cgiSaveGenecartChanges
      tags:
      - Gene lists (carts)
      summary: Edit metadata of a gene cart the user owns
      description: 'Requires a logged-in user who owns the cart. Changed fields are saved; omitted title/organism_id/ldesc
        are overwritten with null and omitted visibility becomes 0. Errors use HTTP 200 and `success: 0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - gc_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in owner.
                gc_id:
                  type: string
                  description: Gene cart ID.
                visibility:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: 1 public, 0 private (default 0).
                organism_id:
                  type: string
                title:
                  type: string
                  description: New cart label.
                ldesc:
                  type: string
                  description: Long description.
      responses:
        '200':
          description: Updated cart, or an error (HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  gene_cart:
                    type: object
                    additionalProperties: true
                    description: The gene cart object (on success).
                  error:
                    type: string
  /cgi/save_layout_arrangement.cgi:
    post:
      operationId: cgiSaveLayoutArrangement
      tags:
      - Collections (layouts)
      summary: Save grid positions and sizes of displays in a layout
      description: Requires a logged-in user who owns the layout (an invalid session raises a server error). Deletes
        all `layout_displays` rows for the layout and re-inserts them from `layout_arrangement`, numbering grid
        positions separately for single- and multi-gene displays.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              - layout_arrangement
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in owner.
                layout_share_id:
                  type: string
                  description: Layout (collection) share ID.
                layout_arrangement:
                  type: string
                  description: 'JSON string `{"single": [...], "multi": [...]}`; each item has display_id, grid_width,
                    grid_height, start_col, start_row. Both keys are required.'
      responses:
        '200':
          description: Result of the save (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/save_new_genecart_form.cgi:
    post:
      operationId: cgiSaveNewGenecartForm
      tags:
      - Gene lists (carts)
      summary: Create a new gene cart from pasted genes or an uploaded file
      description: 'Requires a logged-in user. Weighted uploads must have a unique identifier column, a gene symbol
        column and one or more numeric weight columns; they are also written to `www/carts/cart.<share_id>.tab`
        and `.h5ad`. Unlike most CGIs, errors return HTTP 500 with `{"message": ...}`. Adds a user-history record
        on success.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - new_cart_upload_type
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                new_cart_label:
                  type: string
                  description: Cart label.
                new_cart_organism_id:
                  type: string
                  description: Organism ID.
                new_cart_ldesc:
                  type: string
                  description: Long description.
                is_public:
                  type: string
                  description: Public flag (0/1).
                new_cart_upload_type:
                  type: string
                  enum:
                  - pasted_genes
                  - uploaded-unweighted
                  - uploaded-weighted
                  - labeled-list
                  description: How genes are supplied; labeled-list returns "Not implemented".
                new_cart_pasted_genes:
                  type: string
                  description: Gene symbols separated by spaces, commas, tabs or newlines (pasted_genes).
                new_cart_file:
                  type: string
                  format: binary
                  description: Gene file (uploaded-* types). Unweighted is a plain list of symbols; weighted must
                    be .xlsx/.xls, .tab/.tsv or .csv.
      responses:
        '200':
          description: The new cart's ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Database ID of the new gene cart.
        '500':
          description: Validation or save error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3Message'
  /cgi/save_new_genecart_json.cgi:
    post:
      operationId: cgiSaveNewGenecartJson
      tags:
      - Gene lists (carts)
      summary: Create a new gene cart from a JSON body
      description: Does not use cgi.FieldStorage; reads a JSON object from the request body (`GeneCart.update_from_json`).
        A `session_id` for a logged-in user is required in practice (an invalid one raises an error). Weighted carts
        are also written to `www/carts/cart.<share_id>.tab` and `.h5ad`. Errors return HTTP 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - label
              - genes
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                label:
                  type: string
                organism_id:
                  type: integer
                gctype:
                  type: string
                  enum:
                  - unweighted-list
                  - weighted-list
                  - labeled-list
                  description: labeled-list returns HTTP 500 "Not implemented".
                is_public:
                  type: integer
                  enum:
                  - 0
                  - 1
                is_domain:
                  type: integer
                  enum:
                  - 0
                  - 1
                weight_labels:
                  type: array
                  items:
                    type: string
                  description: Weight column names (weighted-list only).
                genes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Gene identifier (used for weighted carts).
                      gene_symbol:
                        type: string
                      weights:
                        type: array
                        items:
                          type: number
                        description: Weighted carts only.
      responses:
        '200':
          description: The new cart's ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Database ID of the new gene cart.
        '500':
          description: Save error (`message`) or not implemented (`error`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
  /cgi/save_user_account_changes.cgi:
    post:
      operationId: cgiSaveUserAccountChanges
      tags:
      - Account/auth
      summary: Change the user's password or account settings
      description: 'Requires a logged-in user. With `scope=password` the new password is stored for the account
        matching `help_id` (not the session user) and the help_id is rotated. With `scope=settings_change`, email/institution/password
        are updated if given and colorblind_mode/updates_wanted are always written. Errors use HTTP 200 and `success:
        0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - scope
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                scope:
                  type: string
                  enum:
                  - password
                  - settings_change
                help_id:
                  type: string
                  description: Password-reset help ID (scope=password).
                new_password:
                  type: string
                  format: password
                  description: Required for scope=password; optional for settings_change.
                email:
                  type: string
                institution:
                  type: string
                colorblind_mode:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                want_updates:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/save_user_chosen_layout.cgi:
    post:
      operationId: cgiSaveUserChosenLayout
      tags:
      - Collections (layouts)
      summary: Save the user's selected layout (collection)
      description: Requires a valid `session_id`. Sets `guser.layout_id` to the layout with the given share ID (the
        docstring says layout_share_id; an unknown share ID stores NULL). Replaces the legacy set_primary_layout.cgi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                layout_share_id:
                  type: string
                  description: Layout share ID.
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
                    description: '"Invalid session_id" on failure, else empty.'
  /cgi/save_user_default_organism.cgi:
    post:
      operationId: cgiSaveUserDefaultOrganism
      tags:
      - Account/auth
      summary: Save the user's default organism
      description: Requires a logged-in user. Updates `guser.default_org_id`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - default_org_id
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                default_org_id:
                  type: string
                  description: Organism ID.
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                    description: '"User not logged in" when the session is invalid.'
  /cgi/search_datasets.cgi:
    post:
      operationId: cgiSearchDatasets
      tags:
      - Search
      summary: Search and filter datasets with paging
      description: Returns completed, non-removed datasets matching full-text terms and filters, or the datasets
        in one layout. Anonymous users see public datasets only; logged-in users default to public, own and shared
        datasets. Invalid page/limit raise a server error. Logs the search to user history when terms are given.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: Optional; enables ownership filters and is_owner flags.
                custom_list:
                  type: string
                  enum:
                  - most_recent
                  description: Named list; other values return success 0.
                search_terms:
                  type: string
                  description: Space-separated terms (MySQL boolean full-text on title, ldesc, geo_id, pubmed_id).
                organism_ids:
                  type: string
                  description: Comma-separated organism IDs.
                dtypes:
                  type: string
                  description: Comma-separated dataset types; "single-cell-rnaseq" also matches scRNA-seq and "spatial"
                    also matches spatial-h5ad.
                date_added:
                  type: string
                  enum:
                  - day
                  - week
                  - month
                  - year
                  description: Only datasets added within the last interval.
                ownership:
                  type: string
                  description: Comma-separated subset of yours, shared, public, group (logged-in users only).
                layout_share_id:
                  type: string
                  description: List datasets with displays in this layout (ignores sort order).
                include_public_collection_membership:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: Include public layouts in each dataset's layouts list.
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  default: 20
                sort_by:
                  type: string
                  enum:
                  - relevance
                  - title
                  - owner
                  - date_added
                  description: Default is newest first.
      responses:
        '200':
          description: Matching datasets and pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  problem:
                    type: string
                    description: Error text (unrecognized custom_list).
                  datasets:
                    type: array
                    description: Dataset objects with extra keys layouts, preview_image_url, mg_preview_image_url
                      and is_owner.
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    $ref: '#/components/schemas/Cgi3Pagination'
  /cgi/search_gene_carts.cgi:
    post:
      operationId: cgiSearchGeneCarts
      tags:
      - Search
      summary: Search and filter gene carts with paging
      description: Anonymous users see public carts; logged-in users default to public, own and group members' carts.
        The 'shared' ownership option is not implemented (sending only 'shared' produces an invalid query). Invalid
        page/limit raise a server error. Logs the search to user history when terms are given.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: Optional; enables ownership filters and is_owner flags.
                search_terms:
                  type: string
                  description: Space-separated terms (MySQL boolean full-text on label, ldesc).
                organism_ids:
                  type: string
                  description: Comma-separated organism IDs.
                date_added:
                  type: string
                  enum:
                  - day
                  - week
                  - month
                  - year
                ownership:
                  type: string
                  description: Comma-separated subset of yours, public, group (shared is ignored).
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  default: 20
                sort_by:
                  type: string
                  enum:
                  - relevance
                  - title
                  - owner
                  - date_added
                  description: Default is newest first.
      responses:
        '200':
          description: Matching carts and pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 1
                  problem:
                    type: string
                  gene_carts:
                    type: array
                    description: Gene cart objects with extra keys user_name, organism, is_owner and genes or num_genes.
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    $ref: '#/components/schemas/Cgi3Pagination'
  /cgi/search_genes.cgi:
    post:
      operationId: cgiSearchGenes
      tags:
      - Search
      summary: Look up genes and their annotations by symbol
      description: Returns genes with GO terms, dbxref links and aliases, grouped by lowercased symbol and organism
        ID. `search_gene_symbol` is required (missing it raises a server error). When a logged-in user and a known
        `layout_share_id` are given, the search is logged to user history.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - search_gene_symbol
              properties:
                search_gene_symbol:
                  type: string
                  description: One or more gene symbols separated by spaces or commas.
                exact_match:
                  type: string
                  description: Exact-match flag passed to GeneCollection.get_by_gene_symbol.
                is_multi:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: Only affects the history category (multigene_search vs gene_search).
                session_id:
                  type: string
                  description: Optional; used only for history logging.
                layout_share_id:
                  type: string
                  description: Optional; used only for history logging.
      responses:
        '200':
          description: Genes keyed by lowercased symbol.
          content:
            application/json:
              schema:
                type: object
                description: '`{<symbol>: {by_organism: {<organism_id>: [gene, ...]}}}`'
                additionalProperties:
                  type: object
                  properties:
                    by_organism:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
  /cgi/send_email.cgi:
    post:
      operationId: cgiSendEmail
      tags:
      - Account/auth
      summary: Send a forgot-password or account-verification email
      description: Sends mail through Gmail SMTP using credentials in gear.ini; no login required. `forgot_password`
        emails a `<destination_page>?help_id=...` link if the address is registered; `user_verification` emails
        the short form of `verification_code_long`. Any failure (including unknown email) returns success 0 with
        a generic delivery error; an SMTP exception also prints a debug line to stdout ahead of the JSON.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - email
              - scope
              properties:
                email:
                  type: string
                  format: email
                  description: Recipient address.
                scope:
                  type: string
                  enum:
                  - forgot_password
                  - user_verification
                destination_page:
                  type: string
                  description: Base URL of the reset page (forgot_password).
                verification_code_long:
                  type: string
                  description: Long verification code (user_verification).
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/set_user_event_registration.cgi:
    post:
      operationId: cgiSetUserEventRegistration
      tags:
      - Misc
      summary: Register or unregister the user for an event
      description: Requires a logged-in user. Inserts or deletes an `event_registration` row. Used by the workshop
        page. A missing or non-integer registration_status raises a server error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - event_id
              - registration_status
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                event_id:
                  type: string
                  description: Event ID.
                registration_status:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: 1 to register, 0 to unregister.
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  msg:
                    type: string
                  current_count:
                    type: integer
                    description: Number of registrations for the event.
                  event:
                    type: object
                    nullable: true
                    description: Event capacity info.
                    properties:
                      attendees:
                        type: integer
                      user_attending:
                        type: integer
                      user_waitlisted:
                        type: integer
                      max_attendees:
                        type: integer
                      waitlist_size:
                        type: integer
  /cgi/stats.cgi:
    get:
      operationId: cgiStatsGet
      tags:
      - Misc
      summary: Site usage statistics from Google Analytics 4
      description: Queries the GA4 Data API (hardcoded property) with default service credentials. Unlike other
        CGIs it does not use cgi.FieldStorage and reads only the query string, so there is no POST form variant.
        No login required, and no frontend page currently calls it. Sends no-cache headers and, if GEAR_STATS_ALLOWED_ORIGIN
        is set, a CORS header.
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        description: Look-back window in days (clamped).
      - name: top_n
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Rows per top-N report (clamped).
      - name: realtime
        in: query
        schema:
          type: string
          default: '1'
        description: Set to 0, false or no to omit the realtime report.
      responses:
        '200':
          description: Usage report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  range:
                    type: object
                    properties:
                      days:
                        type: integer
                      startDate:
                        type: string
                        example: 30daysAgo
                      endDate:
                        type: string
                        example: today
                  summary:
                    type: object
                    description: Totals activeUsers, sessions, screenPageViews, engagedSessions, eventCount.
                    additionalProperties:
                      type: integer
                  timeseries:
                    type: array
                    description: Per day (date as YYYYMMDD) activeUsers, sessions, screenPageViews.
                    items:
                      type: object
                      additionalProperties: true
                  topPages:
                    type: array
                    description: pagePath, screenPageViews, activeUsers, sessions.
                    items:
                      type: object
                      additionalProperties: true
                  trafficSources:
                    type: array
                    description: sessionSourceMedium, sessions, activeUsers.
                    items:
                      type: object
                      additionalProperties: true
                  countries:
                    type: array
                    description: country, activeUsers, sessions, screenPageViews.
                    items:
                      type: object
                      additionalProperties: true
                  topEvents:
                    type: array
                    description: eventName, eventCount, activeUsers.
                    items:
                      type: object
                      additionalProperties: true
                  realtime:
                    type: object
                    description: Omitted when realtime is disabled.
                    properties:
                      activeUsersNow:
                        type: integer
                      byCountry:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                            activeUsers:
                              type: integer
        '500':
          description: GA4 query failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - false
                  error:
                    type: string
                  details:
                    type: object
                    properties:
                      message:
                        type: string
                      traceback:
                        type: array
                        items:
                          type: string
  /cgi/store_expression_dataset.cgi:
    post:
      operationId: cgiStoreExpressionDataset
      tags:
      - Uploads
      summary: Save the uploaded expression data file for processing
      description: 'Requires a logged-in user. Streams `dataset_file` to `uploads/files/<session_id>/<share_uid>/<share_uid>.<ext>`
        (extension lowercased; .tar.gz/.tgz become `tar.gz`) and writes a status.json with status "uploaded". The
        directory must already exist (created by store_expression_metadata.cgi). If `expected_size` is sent and
        the saved file''s size differs, the file is deleted and an "Upload appears to be incomplete" message is
        returned. Errors use HTTP 200 and `success: 0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              - dataset_format
              - dataset_file
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                share_uid:
                  type: string
                  description: Share UID of the pending upload.
                dataset_format:
                  type: string
                  enum:
                  - mex_3tab
                  - excel
                  - h5ad
                  - rds
                  - spatial
                  description: 'Allowed extensions per format (case-insensitive): mex_3tab .tar, .tar.gz/.tgz or
                    .zip; excel .xlsx only (.xls is rejected with a re-save message); h5ad .h5ad; rds .rds in any
                    case; spatial .tar or .tar.gz. Other values skip the extension check.'
                spatial_format:
                  type: string
                  enum:
                  - cosmx
                  - curio
                  - geomx
                  - visium
                  - visium_hd
                  - visiumhd
                  - xenium
                  description: Required when dataset_format is spatial.
                expected_size:
                  type: integer
                  description: File size in bytes from the browser (File.size), used to detect truncated uploads.
                dataset_file:
                  type: string
                  format: binary
                  description: The expression data file.
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessMessage'
  /cgi/store_expression_metadata.cgi:
    post:
      operationId: cgiStoreExpressionMetadata
      tags:
      - Uploads
      summary: Save the uploader's metadata form to metadata.json
      description: 'Requires a logged-in user. Creates `uploads/files/<session_id>/<share_uid>/` (before checking
        the user) and writes the form fields to metadata.json using legacy key names (e.g. geo_id to geo_accession,
        taxon_id to sample_taxid). Errors use HTTP 200 and `success: 0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_uid
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                share_uid:
                  type: string
                dataset_uid:
                  type: string
                title:
                  type: string
                summary:
                  type: string
                dataset_type:
                  type: string
                annotation_source:
                  type: string
                annotation_version:
                  type: string
                  description: Saved as annotation_release_number.
                geo_id:
                  type: string
                  description: Saved as geo_accession.
                contact_name:
                  type: string
                contact_email:
                  type: string
                contact_institute:
                  type: string
                taxon_id:
                  type: string
                  description: Saved as sample_taxid.
                organism:
                  type: string
                  description: Saved as sample_organism.
                platform_id:
                  type: string
                instrument:
                  type: string
                  description: Saved as instrument_model.
                library_selection:
                  type: string
                library_source:
                  type: string
                library_strategy:
                  type: string
                pubmed_id:
                  type: string
                user_pii_affirmed:
                  type: string
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  error:
                    type: string
                    nullable: true
  /cgi/test.cgi:
    get:
      operationId: cgiTestGet
      tags:
      - Misc
      summary: Test stub that confirms Python CGI execution
      description: Prints a fixed HTML message and reads no parameters.
      responses:
        '200':
          description: Fixed message.
          content:
            text/html:
              schema:
                type: string
                example: Ha! It even works with a python file!
  /cgi/update_layout_visibility.cgi:
    post:
      operationId: cgiUpdateLayoutVisibility
      tags:
      - Collections (layouts)
      summary: Set a layout public or private
      description: Sets `layout.is_public` for the share ID. Requires a logged-in user who owns the layout; otherwise,
        or if the layout is not found, returns success 0 with an `error` message (HTTP 200).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - layout_share_id
              properties:
                session_id:
                  type: string
                  description: Session of the layout owner.
                layout_share_id:
                  type: string
                visibility:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: '"true" for public; anything else sets private.'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/update_password.cgi:
    post:
      operationId: cgiUpdatePassword
      tags:
      - Account/auth
      summary: Reset a password using a help_id
      description: Used by the forgot-password page; no login required. Stores the SHA3-256 hash of `password` for
        the single user with this `help_id` (the docstring's mention of session ID is outdated). Any match count
        other than one returns "Duplicate help ID prefixes". Unlike save_user_account_changes.cgi, the help_id is
        not rotated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - help_id
              - password
              properties:
                help_id:
                  type: string
                  description: Help ID from the reset email link.
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/update_share_id.cgi:
    post:
      operationId: cgiUpdateShareId
      tags:
      - Misc
      summary: Change the share ID (permalink) of a dataset, layout or gene cart the user owns
      description: 'Requires a logged-in owner. Both IDs must be unchanged by secure_filename and the new ID must
        be unused. For gene carts it also renames weighted cart files in `www/carts` and rewrites references under
        `www/projections`. Errors use HTTP 200 and `success: 0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - share_id
              - new_share_id
              - scope
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in owner.
                share_id:
                  type: string
                  description: Current share ID.
                new_share_id:
                  type: string
                  description: New share ID.
                scope:
                  type: string
                  enum:
                  - dataset
                  - layout
                  - genecart
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
  /cgi/upload_expression_metadata.cgi:
    post:
      operationId: cgiUploadExpressionMetadata
      tags:
      - Uploads
      summary: Parse an uploaded Excel metadata file and return it as JSON
      description: 'Requires a logged-in user. Saves the file to `/tmp/<dataset_id>.xlsx`, tries to fill fields
        from GEO, and returns the parsed metadata; nothing is stored permanently. A missing file field raises a
        server error. Errors use HTTP 200 and `success: 0`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - session_id
              - metadata-dataset-id
              - metadata-file-input
              properties:
                session_id:
                  type: string
                  description: Session ID of the logged-in user.
                metadata-dataset-id:
                  type: string
                  description: Dataset UID, used for the temp file name.
                metadata-file-input:
                  type: string
                  format: binary
                  description: Metadata spreadsheet (.xls or .xlsx).
      responses:
        '200':
          description: Parsed metadata (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  message:
                    type: string
                  metadata:
                    type: object
                    additionalProperties: true
                    description: Metadata fields parsed from the file.
  /cgi/validate_help_id.cgi:
    post:
      operationId: cgiValidateHelpId
      tags:
      - Account/auth
      summary: Check a password-reset help_id and return the user name
      description: No login required. Returns the user_name of the account with this help_id. No frontend code currently
        calls it, and its docstring (about share IDs) is copied from validate_share_id.cgi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - help_id
              properties:
                help_id:
                  type: string
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    enum:
                    - 0
                    - 1
                  user_name:
                    type: string
                  error:
                    type: string
  /cgi/validate_share_id.cgi:
    post:
      operationId: cgiValidateShareId
      tags:
      - Misc
      summary: Check that a dataset or layout share ID exists
      description: Legacy; no frontend code currently calls it. `permalink` checks a dataset share ID, `profile`
        a layout share ID; any other scope checks a dataset share ID and fails if it is already shared with the
        user, which needs a valid session_id (otherwise a server error).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - share_id
              properties:
                session_id:
                  type: string
                  description: Needed for the dataset scope.
                share_id:
                  type: string
                scope:
                  type: string
                  enum:
                  - permalink
                  - profile
                  - dataset
                  description: Anything other than permalink or profile is treated as dataset.
      responses:
        '200':
          description: Result (errors also use HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cgi3SuccessError'
components:
  securitySchemes:
    gearSessionCookie:
      type: apiKey
      in: cookie
      name: gear_session_id
      description: Session ID of a logged-in user, set by the login page.
  schemas:
    ApiErrorResponse:
      type: object
      description: Error body returned by most handlers (often with HTTP 200).
      properties:
        success:
          type: integer
          description: -1 (or 0 for some handlers) on failure.
        message:
          type: string
          description: Error message.
    ApiMessageError:
      type: object
      description: flask-restful error body for abort()/HTTPException and for unhandled exceptions ("Internal Server
        Error").
      properties:
        message:
          type: string
          description: Error description.
    ApiReqparseError:
      type: object
      description: flask-restful reqparse error with bundle_errors=True (HTTP 400).
      properties:
        message:
          type: object
          additionalProperties:
            type: string
          description: Argument name to error/help text.
    ApiMemoryErrorResponse:
      type: object
      description: Body returned with HTTP 500 by gear.utils.resource_limits.catch_memory_error.
      properties:
        success:
          type: integer
          enum:
          - -1
          description: Always -1.
        message:
          type: string
          enum:
          - Exceeded memory limit
          description: Fixed message.
        error:
          type: string
          description: MemoryError text.
    ApiAnalysisRef:
      description: 'Analysis selector normalized by gear.analysis.normalize_analysis_input: an object with id/type,
        a bare analysis ID string, or null for the primary dataset.'
      nullable: true
      oneOf:
      - type: object
        properties:
          id:
            type: string
            description: Analysis ID.
          type:
            type: string
            enum:
            - primary
            - public
            - user_saved
            - user_unsaved
            description: Analysis type.
        additionalProperties: true
      - type: string
    ApiAnalysis:
      type: object
      description: Serialized gear.analysis.Analysis (object __dict__).
      properties:
        id:
          type: string
        dataset_id:
          type: string
        label:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true
        type:
          type: string
          enum:
          - primary
          - public
          - user_saved
          - user_unsaved
        vetting:
          type: string
          nullable: true
          enum:
          - owner
          - gear
          - community
        tsne:
          type: object
          additionalProperties: true
          description: tSNE/UMAP settings including tsne_calculated and umap_calculated flags.
      additionalProperties: true
    ApiObsFilters:
      type: object
      description: obs column name to list of allowed values.
      additionalProperties:
        type: array
        items:
          type: string
    ApiImageResponse:
      type: object
      description: Base64-encoded image response.
      properties:
        success:
          type: integer
          description: 1 on success; 2 (or 3) when message holds a warning.
        message:
          type: string
          description: Warning text, or empty.
        image:
          type: string
          format: byte
          description: Base64-encoded image bytes.
        image_format:
          type: string
          enum:
          - pdf
          - webp
          - png
          description: Image format.
    ApiPlotJsonResponse:
      type: object
      properties:
        success:
          type: integer
          description: 1 on success; 2 or 3 when message holds a warning (see operation description for the [2]
            quirk).
        message:
          type: string
          description: Warning text (may contain HTML <li> items), or empty.
        plot_json:
          type: object
          additionalProperties: true
          description: Plotly figure JSON (data and layout).
    ApiPlotlyDataRequest:
      type: object
      required:
      - gene_symbol
      properties:
        gene_symbol:
          type: string
          description: Gene symbol (or pattern name when projection_id is set).
        plot_type:
          type: string
          description: Plot type passed to generate_plot, e.g. bar, violin, scatter, line, contour, box, strip,
            scattergl. tsne_dynamic and tsne/umap_dynamic are aliased to scatter; scatter with jitter becomes strip.
        analysis:
          $ref: '#/components/schemas/ApiAnalysisRef'
        x_axis:
          type: string
          description: obs column (or raw_value, X_tsne_1, X_umap_1, X_pca_1...).
        y_axis:
          type: string
          default: raw_value
          description: obs column or raw_value.
        z_axis:
          type: string
          description: Contour z column; defaults to raw_value for contour and is ignored otherwise.
        point_label:
          type: string
          description: obs column used for point text labels.
        color_name:
          type: string
          description: obs column used for color.
        colors:
          description: Color map of category to color (object) or a continuous colorscale (array).
          oneOf:
          - type: object
            additionalProperties:
              type: string
          - type: array
            items: {}
        color_palette:
          type: string
          description: Named palette.
        reverse_palette:
          type: boolean
          description: Reverse the palette.
        colorblind_mode:
          type: boolean
          default: false
          description: Replace colors with viridis/cividis_r.
        facet_row:
          type: string
          description: obs column for facet rows.
        facet_col:
          type: string
          description: obs column for facet columns.
        order:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: obs column to ordered category list.
        size_by_group:
          type: string
          description: obs column for scatter marker sizes (ignored with jitter).
        marker_size:
          type: integer
          default: 3
          description: Scatter marker size.
        jitter:
          type: boolean
          default: false
          description: Jitter scatter points (renders as strip plot).
        x_min:
          type: number
          nullable: true
          description: X axis range minimum.
        x_max:
          type: number
          nullable: true
          description: X axis range maximum.
        y_min:
          type: number
          nullable: true
          description: Y axis range minimum.
        y_max:
          type: number
          nullable: true
          description: Y axis range maximum.
        x_title:
          type: string
          description: X axis title (defaults to x_axis).
        y_title:
          type: string
          description: Y axis title (defaults to y_axis or "expression of <gene>").
        vlines:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Vertical line property dicts.
        hide_x_labels:
          type: boolean
          default: false
        hide_y_labels:
          type: boolean
          default: false
        hide_legend:
          type: boolean
          default: false
        obs_filters:
          $ref: '#/components/schemas/ApiObsFilters'
        projection_id:
          type: string
          nullable: true
          description: projectR projection ID; plot pattern values instead of a gene.
        expression_min_clip:
          type: number
          nullable: true
          description: Lower clip for expression values.
        return_image:
          type: boolean
          default: false
          description: Return a base64 PDF instead of plot JSON.
        custom_props:
          type: object
          additionalProperties: true
          description: Extra kwargs for generate_plot (keys annotations, coloraxes, layout, traces, xaxes, yaxes).
    ApiPlotlyDataResponse:
      type: object
      description: PlotlyData success body (the plot settings are echoed back).
      properties:
        success:
          type: integer
          description: 1, or 2 when several Ensembl IDs match the gene.
        message:
          type: string
          description: Warning text or empty.
        gene_symbol:
          type: string
        mapped_gene_symbol:
          type: string
          nullable: true
          description: Only present (null) in error bodies built from the initial return dict.
        plot_json:
          type: object
          nullable: true
          additionalProperties: true
          description: Plotly figure JSON; null in error bodies.
        x_axis:
          type: string
          nullable: true
        y_axis:
          type: string
          nullable: true
        z_axis:
          type: string
          nullable: true
        x_min:
          type: number
          nullable: true
        y_min:
          type: number
          nullable: true
        x_max:
          type: number
          nullable: true
        y_max:
          type: number
          nullable: true
        x_title:
          type: string
          nullable: true
        y_title:
          type: string
          nullable: true
          description: Null when the auto-generated "expression of <gene>" title was used.
        vlines:
          type: array
          items:
            type: object
            additionalProperties: true
        point_label:
          type: string
          nullable: true
        size_by_group:
          type: string
          nullable: true
        marker_size:
          type: integer
          nullable: true
        jitter:
          type: boolean
        hide_x_labels:
          type: boolean
        hide_y_labels:
          type: boolean
        hide_legend:
          type: boolean
        color_name:
          type: string
          nullable: true
        facet_row:
          type: string
          nullable: true
        facet_col:
          type: string
          nullable: true
        plot_colors:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Categorical color map used (null for continuous color).
        plot_palette:
          type: string
          nullable: true
          description: Palette used.
        reverse_palette:
          type: boolean
          nullable: true
        obs_filters:
          $ref: '#/components/schemas/ApiObsFilters'
        plot_order:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          description: Category order for x_axis, color, facet columns.
    ApiMgPlotlyDataRequest:
      type: object
      properties:
        plot_type:
          type: string
          enum:
          - dotplot
          - heatmap
          - mg_violin
          - volcano
          - quadrant
          description: Multi-gene plot type; other values return success -1.
        gene_symbols:
          type: array
          items:
            type: string
            nullable: true
          description: Genes to plot (null entries are dropped). Required for dotplot, heatmap (2+), mg_violin.
        analysis:
          $ref: '#/components/schemas/ApiAnalysisRef'
        obs_filters:
          $ref: '#/components/schemas/ApiObsFilters'
        primary_col:
          type: string
          description: Primary grouping column (required for dotplot, mg_violin and matrixplot heatmaps).
        secondary_col:
          type: string
          description: Secondary grouping column.
        sort_order:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: obs column to ordered category list.
        colorscale:
          type: string
          nullable: true
          description: Heatmap/dotplot colorscale.
        reverse_colorscale:
          type: boolean
          default: false
        clusterbar_fields:
          type: array
          items:
            type: string
          description: Heatmap cluster bar columns; must be the primary or secondary grouping.
        subsample_limit:
          type: integer
          default: 0
          description: Heatmap subsample limit (0 = all; capped at 5000 when clustering obs).
        matrixplot:
          type: boolean
          default: false
          description: Heatmap aggregated by group.
        center_around_zero:
          type: boolean
          default: false
        cluster_obs:
          type: boolean
          default: false
        cluster_genes:
          type: boolean
          default: false
        flip_axes:
          type: boolean
          default: false
        distance_metric:
          type: string
          default: euclidean
          description: Clustering distance metric.
        hide_obs_labels:
          type: boolean
          default: false
        hide_gene_labels:
          type: boolean
          default: false
        query_condition:
          type: string
          description: Volcano query condition as "<column>;-;<value>".
        ref_condition:
          type: string
          description: Volcano reference / quadrant control condition as "<column>;-;<value>".
        compare1_condition:
          type: string
          description: Quadrant first comparison condition ("<column>;-;<value>").
        compare2_condition:
          type: string
          description: Quadrant second comparison condition ("<column>;-;<value>").
        de_test_algo:
          type: string
          default: t-test
          description: Differential expression test.
        pvalue_threshold:
          type: number
          default: 0.05
        lower_logfc_threshold:
          type: number
          default: -2
        upper_logfc_threshold:
          type: number
          default: 2
        adj_pvals:
          type: boolean
          default: true
          description: Use adjusted p-values (volcano).
        annotate_nonsignificant:
          type: boolean
          default: true
        fold_change_cutoff:
          type: number
          default: 2
          description: Quadrant fold-change cutoff.
        fdr_cutoff:
          type: number
          default: 0.05
          description: Quadrant FDR cutoff.
        include_zero_fc:
          type: boolean
          default: true
        stacked_violin:
          type: boolean
          default: false
        violin_add_points:
          type: boolean
          default: false
        plot_title:
          type: string
          nullable: true
        legend_title:
          type: string
          nullable: true
        projection_id:
          type: string
          nullable: true
          description: projectR projection ID.
        expression_min_clip:
          type: number
          nullable: true
        colorblind_mode:
          type: boolean
          default: false
        return_image:
          type: boolean
          default: false
          description: Return a base64 PDF instead of plot JSON.
        custom_props:
          type: object
          additionalProperties: true
          description: Extra plot kwargs.
    ApiTsneBaseRequest:
      type: object
      description: Shared reqparse arguments for /tsne and /mg_tsne (resources/tsne_data.py `parser`).
      properties:
        plot_type:
          type: string
          default: tsne_static
          enum:
          - tsne_static
          - tsne
          - umap_static
          - pca_static
          - mg_tsne_static
          - mg_umap_static
          - mg_pca_static
          description: Keys of PLOT_TYPE_TO_BASIS ("tsne" is legacy).
        analysis:
          type: object
          nullable: true
          additionalProperties: true
          description: Analysis object {id, type} (reqparse type=dict, JSON only).
        x_axis:
          type: string
          default: tSNE_1
          description: obs column or embedding column for X.
        y_axis:
          type: string
          default: tSNE_2
          description: obs column or embedding column for Y.
        colorize_legend_by:
          type: string
          nullable: true
          description: obs column for an extra colorized plot.
        max_columns:
          type: integer
          nullable: true
          description: Max plots per row.
        expression_palette:
          type: string
          default: YlOrRd
          description: Matplotlib colormap (also bluered, bublrd, multicolor_diverging).
        reverse_palette:
          type: boolean
          default: false
        colors:
          type: object
          additionalProperties:
            type: string
          description: Category to color.
        order:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Category order.
        flip_x:
          type: boolean
          default: false
        flip_y:
          type: boolean
          default: false
        horizontal_legend:
          type: boolean
          default: false
        marker_size:
          type: integer
          minimum: 1
          nullable: true
          description: Positive integer marker size.
        center_around_median:
          type: boolean
          default: false
        vmin:
          type: number
          nullable: true
          description: Color minimum cap.
        vmax:
          type: number
          nullable: true
          description: Color maximum cap.
        make_zero_gray:
          type: boolean
          default: true
        enforce_equal_aspect:
          type: boolean
          default: false
        obs_filters:
          $ref: '#/components/schemas/ApiObsFilters'
        projection_id:
          type: string
          nullable: true
          description: projectR projection ID.
        expression_min_clip:
          type: number
          nullable: true
        colorblind_mode:
          type: boolean
          default: false
        high_dpi:
          type: boolean
          default: false
          description: Return a PDF instead of WebP/PNG.
    ApiTsneDataRequest:
      allOf:
      - $ref: '#/components/schemas/ApiTsneBaseRequest'
      - type: object
        required:
        - gene_symbol
        properties:
          gene_symbol:
            type: string
            description: Gene to plot.
          plot_by_group:
            type: string
            nullable: true
            description: obs column to split plots by group.
          hide_group_nonmembers:
            type: boolean
            default: false
          skip_gene_plot:
            type: boolean
            default: false
          two_way_palette:
            type: boolean
            default: false
            description: Bring data extremes to the front.
    ApiMgTsneDataRequest:
      allOf:
      - $ref: '#/components/schemas/ApiTsneBaseRequest'
      - type: object
        required:
        - gene_symbols
        properties:
          gene_symbols:
            type: array
            items:
              type: string
            description: Genes to plot (JSON only).
    ApiSvgDataResponse:
      type: object
      description: 'success, message and scores, plus the expression dataframe spread via **df.to_dict() into top-level
        keys: "data" (observation to value; includes "<cell_type>--mean" rows when a cell_type column exists) and,
        when there is no cell_type column, one key per obs column.'
      properties:
        success:
          type: integer
          description: 1, or 2 when several Ensembl IDs match.
        message:
          type: string
          description: Warning or empty.
        scores:
          type: object
          properties:
            dataset:
              type: object
              description: dataset_id, min, max over the whole matrix.
              additionalProperties: true
            gene:
              type: object
              description: gene, min, max for the selected gene.
              additionalProperties: true
            tissue:
              type: object
              description: Observation name to {min, max}.
              additionalProperties: true
            user_defined:
              type: object
              description: '{min, max} from vmin/vmax; present only when either is given.'
              additionalProperties: true
        data:
          type: object
          additionalProperties:
            type: number
          description: Observation (tissue) name to expression value.
      additionalProperties: true
    ApiGoslingSpecResponse:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
          description: 1 on success, 0 on error.
        spec:
          description: Gosling spec as a JSON string on success; empty object on error.
          oneOf:
          - type: string
          - type: object
        position:
          type: string
          description: '"<assembly>.<chr>:<start>-<end>", "NA" if not located, empty on error.'
        message:
          type: string
          description: Error text or empty.
        hic_found:
          type: boolean
          description: True if a HiC track was added (affects zooming).
    ApiProjectRRequest:
      type: object
      description: Shared reqparse arguments (resources/projectr.py `parser`). Also accepted as query/form values.
        The client also sends session_id, which is ignored.
      required:
      - genecart_id
      properties:
        genecart_id:
          type: string
          description: Weighted (pattern) or unweighted gene cart share ID.
        scope:
          type: string
          description: Gene cart type; "unweighted-list" builds a binary loading, anything else loads a weighted
            cart file.
        algorithm:
          type: string
          enum:
          - pca
          - binary
          - 2silca
          - nmf
          - fixednmf
          description: Projection algorithm.
        zscore:
          type: boolean
          default: false
          description: Z-score the dataset before projecting.
        full_output:
          type: boolean
          nullable: true
          description: Also produce a p-value matrix. Defaults to [projectR_service] full_output and is forced false
            unless algorithm is nmf.
        analysis:
          type: string
          description: Parsed but not used.
    ApiProjectRJobStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          description: Job state.
        result:
          type: object
          nullable: true
          description: Always has projection_id; when complete also success, message, num_common_genes, num_genecart_genes,
            num_dataset_genes.
          properties:
            projection_id:
              type: string
            success:
              type: integer
            message:
              type: string
            num_common_genes:
              type: integer
              nullable: true
            num_genecart_genes:
              type: integer
              nullable: true
            num_dataset_genes:
              type: integer
              nullable: true
        error:
          type: string
          nullable: true
          description: Failure reason when status is failed.
    ApiDisplayTypesRequest:
      type: object
      required:
      - dataset_id
      properties:
        dataset_id:
          type: string
          description: Dataset ID (used instead of the path segment).
        session_id:
          type: string
          description: gEAR session ID used to resolve user analyses.
        analysis_id:
          type: string
          nullable: true
          description: Analysis ID; omit for the primary dataset.
    ApiTrackHubCopyResult:
      type: object
      properties:
        success:
          type: boolean
          description: True when queued or processed.
        message:
          type: string
          description: Status or error message.
        job_id:
          type: string
          nullable: true
          description: Job UUID (absent on early 400 errors).
    ApiUploadStatus:
      type: object
      description: Contents of the staging status.json written by the upload pipeline or gear.trackhub.write_status.
      properties:
        job_id:
          type: string
          description: Job UUID.
        process_id:
          type: integer
          description: Legacy processing PID.
        status:
          type: string
          description: e.g. queued, processing, complete, error.
        message:
          type: string
        progress:
          type: integer
          description: 0-100.
        completed_tracks:
          type: integer
          description: Track hub uploads only.
        total_tracks:
          type: integer
          description: Track hub uploads only.
        track_statuses:
          type: object
          additionalProperties: true
          description: Track hub uploads only.
      additionalProperties: true
    ApiUploadStatusError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        status:
          type: string
          enum:
          - error
        progress:
          type: integer
          enum:
          - 0
    ApiTopPcaGenesForm:
      type: object
      required:
      - dataset_id
      - pcs
      properties:
        dataset_id:
          type: string
          description: Dataset ID.
        session_id:
          type: string
          description: gEAR session ID (form field, not cookie).
        analysis_id:
          type: string
          description: Analysis ID.
        analysis_type:
          type: string
          enum:
          - primary
          - public
          - user_saved
          - user_unsaved
          description: Analysis type.
        pcs:
          type: string
          description: Comma-separated principal component numbers; 2 to 5 components.
          example: 1,2,3
    Cgi1SuccessError:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
        error:
          type: string
          description: Error message (empty or absent on success)
    Cgi1SuccessMessage:
      type: object
      properties:
        success:
          type: integer
          enum:
          - 0
          - 1
        message:
          type: string
    Cgi1ErrorOnly:
      type: object
      properties:
        error:
          type: string
    Cgi1AnalysisType:
      type: string
      enum:
      - primary
      - public
      - user_saved
      - user_unsaved
      description: Analysis class
    Cgi1ProcessingStatus:
      type: object
      properties:
        job_id:
          description: Queue job UUID, or -1 on error
        status:
          type: string
          enum:
          - queued
          - extracting
          - processing
          - error
          - complete
        message:
          type: string
        progress:
          type: integer
          description: 0-100
    Cgi1DownloadProjectionParams:
      type: object
      required:
      - projection_id
      properties:
        share_id:
          type: string
          description: Dataset share ID (preferred)
        dataset_id:
          type: string
          description: Dataset ID (legacy; used if share_id absent)
        projection_id:
          type: string
    Cgi1DownloadSourceParams:
      type: object
      required:
      - type
      properties:
        share_id:
          type: string
          description: Dataset share ID (preferred; required for type=metadata)
        dataset_id:
          type: string
          description: Dataset ID (legacy)
        type:
          type: string
          enum:
          - tarball
          - h5ad
          - metadata
        analysis_id:
          type: string
          description: Download this analysis's H5AD instead (type=h5ad)
        session_id:
          type: string
          description: Needed to locate user_unsaved analyses
    Cgi1AnalysisImageParams:
      type: object
      required:
      - dataset_id
      - analysis_name
      properties:
        session_id:
          type: string
        dataset_id:
          type: string
        analysis_id:
          type: string
        analysis_type:
          $ref: '#/components/schemas/Cgi1AnalysisType'
        analysis_name:
          type: string
          description: Scanpy figure base name, e.g. pca_variance_ratio
    Cgi1TagList:
      type: object
      properties:
        success:
          type: integer
