            application/json:
              schema:
                $ref: '#/components/schemas/Cgi1Display'
  /cgi/get_dataset_display_image.cgi:
    post:
      operationId: cgiGetDatasetDisplayImage
      tags:
      - Displays
      summary: Return the static preview image path for a display
      description: Returns a JSON string path relative to the cgi directory (../img/dataset_previews/<dataset_id>.<display_id>.png),
        substituting gosling.png for gosling displays and missing.png when no preview exists.
