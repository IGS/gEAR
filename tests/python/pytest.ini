[pytest]
testpaths = .
python_files = test_*.py
# -ra: list every skipped/failed test (and why) in the summary.
# --strict-markers: a mark that isn't registered below is an error, so a typo can't silently
#  create a new, unselected category.
addopts = -ra --strict-markers

# Markers tag tests that need an optional dependency stack. Select them with -m, e.g.
#   pytest -m spatial          only tests marked spatial
#   pytest -m "not spatial"    everything except those
# Each marked module also calls pytest.importorskip() for its packages, so a plain "pytest"
#  runs the core tests and skips any stack that isn't installed. To add a stack (e.g. epigenome):
#  register it here, mark its modules with pytestmark = pytest.mark.<name>, importorskip its
#  packages, add requirements-<name>.txt, and add a CI job that runs "pytest -m <name>".
markers =
    spatial: needs the SpatialData stack (pip install -r requirements-spatial.txt)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::SyntaxWarning
