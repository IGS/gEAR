<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en"> <!--<![endif]-->
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>gEAR Analytics</title>
        <meta name="description" content="Site traffic and content statistics for this gEAR portal">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="-1">
        <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">

        <!-- This is needed because mod_rewrite doesn't work well with relative paths.  This will need
            to be changed for any hosts where gEAR is not at the webserver root.
        -->
        <base href="/" />

        <link rel="stylesheet" href="css/gear-theme-purple.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />

        <!-- Fancy animation effects -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

        <style>
            :root {
                --dash-border: #dcd9eb;
                --dash-muted: #5c5877;
                --dash-surface: #ffffff;
                --dash-accent: var(--gear-bg-secondary, #544A8E);
                --live-blue: #2f7ee8;
                --dash-radius: 8px;
                --dash-shadow: 0 1px 2px rgba(54, 46, 92, 0.06);
            }

            body {
                background-color: #f6f5fb;
                color: #2b2740;
                min-height: 100vh;
            }

            /* ---------- Page header ---------- */
            .dash-header {
                background: linear-gradient(135deg, var(--gear-bg-primary, #362E5C), var(--gear-bg-secondary, #544A8E));
                color: #fff;
                padding: 1.25rem 2rem;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
            }
            .dash-header h1 {
                font-size: 1.5rem;
                font-weight: 700;
                line-height: 1.2;
            }
            .dash-header-actions {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.75rem;
                font-size: 0.8125rem;
            }

            /* ---------- Layout ---------- */
            .dash-main {
                max-width: 1500px;
                margin: 0 auto;
                padding: 1.5rem 2rem 3rem;
            }
            .dash-section + .dash-section {
                margin-top: 2.5rem;
            }
            .dash-section-title {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 0.25rem 0.75rem;
                margin-bottom: 1rem;
                padding-bottom: 0.5rem;
                border-bottom: 2px solid var(--dash-accent);
                font-size: 1.25rem;
                font-weight: 700;
                color: var(--gear-bg-primary, #362E5C);
            }
            .dash-section-title small {
                font-size: 0.8125rem;
                font-weight: 400;
                color: var(--dash-muted);
            }
            .dash-section .columns {
                margin-top: 0;
                margin-bottom: 0;
            }
            .dash-section .column {
                display: flex;
            }
            .dash-section .column > .panel-box {
                width: 100%;
            }

            /* ---------- KPI cards ---------- */
            .kpi-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            .kpi {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                background: var(--dash-surface);
                border: 1px solid var(--dash-border);
                border-radius: var(--dash-radius);
                padding: 0.875rem 1rem;
            }
            .kpi-icon {
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--dash-accent);
                opacity: 0.8;
            }
            .kpi-value {
                font-size: 1.5rem;
                font-weight: 600;
                line-height: 1.1;
                white-space: nowrap;
                color: var(--gear-bg-primary, #362E5C);
            }
            .kpi-label {
                font-size: 0.8125rem;
                color: var(--dash-muted);
            }

            /* ---------- Panels ---------- */
            .panel-box {
                display: flex;
                flex-direction: column;
                background: var(--dash-surface);
                border: 1px solid var(--dash-border);
                border-radius: var(--dash-radius);
                box-shadow: var(--dash-shadow);
                padding: 1rem 1.25rem 1.25rem;
                min-width: 0;
            }
            .panel-box h3 {
                font-size: 0.9375rem;
                font-weight: 700;
                color: var(--gear-bg-primary, #362E5C);
                margin-bottom: 0.75rem;
            }
            .panel-box h3 small {
                font-weight: 400;
                color: var(--dash-muted);
            }
            .chart-box {
                position: relative;
                height: 320px;
            }

            /* ---------- Tables ---------- */
            .table-scroll {
                overflow-x: auto;
            }
            .dash-table {
                width: 100%;
                font-size: 0.8125rem;
                border-collapse: collapse;
            }
            .dash-table th {
                padding: 0.5rem 0.5rem;
                text-align: left;
                font-size: 0.6875rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--dash-muted);
                border-bottom: 2px solid var(--dash-border);
                white-space: nowrap;
            }
            .dash-table td {
                padding: 0.5rem;
                border-bottom: 1px solid #efedf7;
                vertical-align: middle;
            }
            .dash-table tbody tr:last-child td {
                border-bottom: none;
            }
            .dash-table tbody tr:hover {
                background: #faf9fe;
            }
            .dash-table .num {
                text-align: right;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .dash-table .label-cell {
                max-width: 22rem;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .dash-table code {
                background: transparent;
                padding: 0;
                color: var(--gear-bg-primary, #362E5C);
                font-size: 0.8125rem;
            }
            .bar-cell {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 0.625rem;
            }
            .bar-track {
                flex: none;
                width: 5rem;
                height: 6px;
                border-radius: 3px;
                background: #efedf7;
                overflow: hidden;
            }
            .bar-fill {
                display: block;
                height: 100%;
                border-radius: 3px;
                background: var(--dash-accent);
            }
            .empty-state {
                padding: 1.5rem 0;
                text-align: center;
                font-size: 0.875rem;
                color: var(--dash-muted);
            }

            /* ---------- Live users ---------- */
            .live-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 0.5rem;
            }
            .live-head h3 {
                margin-bottom: 0;
            }
            .live-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                font-size: 0.75rem;
                font-weight: 600;
                color: var(--live-blue);
            }
            .live-dot {
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background: var(--live-blue);
                animation: live-pulse 2s ease-in-out infinite;
            }
            @keyframes live-pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.35; }
            }
            @media (prefers-reduced-motion: reduce) {
                .live-dot { animation: none; }
            }
            .live-hero {
                text-align: center;
                padding: 1.25rem 0 1.5rem;
            }
            .live-number {
                font-size: 4rem;
                font-weight: 800;
                line-height: 1;
                color: #1f5fc4;
            }
            .live-caption {
                margin-top: 0.5rem;
                font-size: 0.8125rem;
                color: var(--dash-muted);
            }
            .live-subtitle {
                margin-bottom: 0.25rem;
                padding-top: 0.75rem;
                border-top: 1px solid var(--dash-border);
                font-size: 0.6875rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--dash-muted);
            }
            .live-list {
                list-style: none;
                margin: 0;
                padding: 0;
                font-size: 0.8125rem;
            }
            .live-list li {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 4.5rem 1.5rem;
                align-items: center;
                gap: 0.75rem;
                padding: 0.4rem 0;
            }
            .live-country {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .live-list strong {
                text-align: right;
                color: #1f5fc4;
            }
            .live-bar {
                height: 6px;
                border-radius: 3px;
                background: #e3eeff;
                overflow: hidden;
            }
            .live-bar > span {
                display: block;
                height: 100%;
                border-radius: 3px;
                background: var(--live-blue);
            }

            /* ---------- Date range ---------- */
            .range-toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem 1rem;
                margin-bottom: 1.25rem;
            }
            .range-toolbar .buttons {
                margin-bottom: 0;
            }
            .range-toolbar .buttons .button {
                margin-bottom: 0;
            }
            .range-toolbar .buttons .button.is-active {
                background: var(--gear-bg-primary, #362E5C);
                border-color: var(--gear-bg-primary, #362E5C);
                color: #fff;
            }
            .range-label {
                font-size: 0.75rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--dash-muted);
            }
            .range-custom {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.8125rem;
            }
            .range-custom input[type="date"] {
                width: auto;
            }
            #rangeError {
                flex-basis: 100%;
                margin: 0;
            }
            #rangeError:empty {
                display: none;
            }

            /* ---------- Sortable headers ---------- */
            .sort-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.125rem;
                padding: 0;
                border: none;
                background: transparent;
                font: inherit;
                letter-spacing: inherit;
                text-transform: inherit;
                color: inherit;
                cursor: pointer;
            }
            .sort-btn .icon {
                opacity: 0.45;
            }
            .sort-btn:hover,
            .sort-btn.is-active {
                color: var(--gear-bg-primary, #362E5C);
            }
            .sort-btn:hover .icon,
            .sort-btn.is-active .icon {
                opacity: 1;
            }
            .sort-btn:focus-visible {
                outline: 2px solid var(--dash-accent);
                outline-offset: 2px;
                border-radius: 3px;
            }

            /* ---------- Misc ---------- */
            #loadingBar,
            #errorRegion .notification {
                margin-bottom: 1rem;
            }
            .dash-header .button.is-light {
                color: var(--gear-bg-primary, #362E5C);
            }

            @media (max-width: 1023px) {
                .dash-header,
                .dash-main {
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <a href="#main-content" class="is-sr-only">Skip to main content</a>

        <header class="dash-header">
            <div>
                <h1>
                    <span class="icon-text">
                        <span class="icon" aria-hidden="true"><i class="mdi mdi-chart-box-outline"></i></span>
                        <span>gEAR Analytics</span>
                    </span>
                </h1>
            </div>
            <div class="dash-header-actions">
                <span id="lastUpdated" aria-live="polite"></span>
                <button id="refreshBtn" type="button" class="button is-light is-small">
                    <span class="icon" aria-hidden="true"><i class="mdi mdi-refresh"></i></span>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <main id="main-content" class="dash-main">
            <div id="errorRegion" role="alert"></div>
            <progress id="loadingBar" class="progress is-small is-primary is-hidden" max="100" aria-label="Loading analytics"></progress>

            <section class="dash-section" aria-labelledby="traffic-heading">
                <h2 id="traffic-heading" class="dash-section-title">
                    Site traffic
                    <small id="trafficRangeLabel"></small>
                </h2>

                <div class="range-toolbar" role="group" aria-label="Date range">
                    <span class="range-label" id="rangeLabel">Date range</span>
                    <div class="buttons has-addons" aria-labelledby="rangeLabel">
                        <button type="button" class="button is-small" data-range-days="7" aria-pressed="false">7 days</button>
                        <button type="button" class="button is-small" data-range-days="30" aria-pressed="true">30 days</button>
                        <button type="button" class="button is-small" data-range-days="90" aria-pressed="false">90 days</button>
                        <button type="button" class="button is-small" data-range-days="365" aria-pressed="false">1 year</button>
                        <button type="button" id="rangeCustomBtn" class="button is-small" aria-pressed="false">Custom</button>
                    </div>
                    <form id="customRangeForm" class="range-custom is-hidden" novalidate>
                        <label for="rangeStart">From</label>
                        <input id="rangeStart" class="input is-small" type="date">
                        <label for="rangeEnd">to</label>
                        <input id="rangeEnd" class="input is-small" type="date">
                        <button type="submit" class="button is-primary is-small">Apply</button>
                        <p id="rangeError" class="help is-danger" role="alert"></p>
                    </form>
                </div>

                <div id="summaryCards" class="kpi-grid"></div>

                <div class="columns is-multiline">
                    <div class="column is-8-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Activity trends</h3>
                            <div class="chart-box">
                                <canvas id="timeseriesChart" role="img" aria-label="Line chart of daily active users, sessions and page views"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="column is-4-desktop is-12-tablet">
                        <div class="panel-box">
                            <div class="live-head">
                                <h3>Live now</h3>
                                <span class="live-badge"><span class="live-dot" aria-hidden="true"></span>Live</span>
                            </div>
                            <div id="realtimeContainer" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <div class="columns is-multiline">
                    <div class="column is-7-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Top pages</h3>
                            <div id="topPagesContainer" class="table-scroll" data-sortable-table></div>
                        </div>
                    </div>
                    <div class="column is-5-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Traffic sources</h3>
                            <div id="trafficSourcesContainer" class="table-scroll" data-sortable-table></div>
                        </div>
                    </div>
                </div>

                <div class="columns is-multiline">
                    <div class="column is-7-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Countries</h3>
                            <div id="countriesContainer" class="table-scroll" data-sortable-table></div>
                        </div>
                    </div>
                    <div class="column is-5-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Top events</h3>
                            <div id="topEventsContainer" class="table-scroll" data-sortable-table></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="dash-section" aria-labelledby="platform-heading">
                <h2 id="platform-heading" class="dash-section-title">
                    Platform content
                    <small>Datasets and registered content</small>
                </h2>

                <div id="platformCards" class="kpi-grid"></div>

                <div class="columns is-multiline">
                    <div class="column is-6-desktop is-12-tablet">
                        <div class="panel-box">
                            <h3>Datasets over time <small>(cumulative)</small></h3>
                            <div class="chart-box">
                                <canvas id="datasetsDatesChart" role="img" aria-label="Line chart of the cumulative number of datasets added over time"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="column is-3-desktop is-6-tablet">
                        <div class="panel-box">
                            <h3>Datasets by type</h3>
                            <div class="chart-box">
                                <canvas id="datasetsTypeChart" role="img" aria-label="Doughnut chart of datasets by type"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="column is-3-desktop is-6-tablet">
                        <div class="panel-box">
                            <h3>Dataset load status</h3>
                            <div class="chart-box">
                                <canvas id="datasetsStatusChart" role="img" aria-label="Doughnut chart of datasets by load status"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Chart.js Library -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

        <script type="module" src="./js/analytics-dashboard.js"></script>
    </body>
</html>
