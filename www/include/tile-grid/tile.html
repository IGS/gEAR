<!-- Templates to be used with the TileGrid or an individual DatasetTile -->

<template id="tmpl-tile-grid-tile">
    <div class="js-tile card has-background-white">
        <header class="card-header has-background-primary">
            <div class="card-header-title py-0"></div>
            <div class="card-header-icon">

                <div class="dropdown is-right is-align-self-flex-start">
                    <div class="button js-expand-display is-clickable">
                        <span class="icon">
                            <i class="mdi mdi-24px mdi-arrow-expand-all"></i>
                        </span>
                    </div>
                    <div class="button js-shrink-display is-clickable">
                        <span class="icon">
                            <i class="mdi mdi-24px mdi-arrow-collapse-all"></i>
                        </span>
                    </div>
                    <button class="button dropdown-trigger js-menu-dropdown" aria-label="Toggle dropdown menu of options" aria-haspopup="true" aria-controls="dropdown-menu">
                        <span class="icon">
                            <i class="mdi mdi-24px mdi-18px mdi-dots-vertical"></i>
                        </span>
                    </button>
                    <div class="dropdown-menu" role="menu">
                        <div class="dropdown-content">
                            <a class="dropdown-item" data-tool="display">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-view-grid-outline"></i>
                                    </span>
                                    <span>Choose Display</span>
                                </span>
                            </a>

                            <a class="dropdown-item" data-tool="info">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-information-slab-circle-outline"></i>
                                    </span>
                                    <span>Dataset Information</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="publication" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-school-outline"></i>
                                    </span>
                                    <span>Dataset publication</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="cite" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-book-open-variant-outline"></i>
                                    </span>
                                    <span>Citation</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="geo" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-earth"></i>
                                    </span>
                                    <span>GEO Information</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="notes">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-pencil-box-outline"></i>
                                    </span>
                                    <span>Take Notes</span>
                                </span>
                            </a>
                            <hr class="dropdown-divider">
                            <a class="dropdown-item" data-tool="single-cell" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-chart-line"></i>
                                    </span>
                                    <span>Single Cell Workbench</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="compare" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-compare-horizontal"></i>
                                    </span>
                                    <span>Comparison Tool</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="single-gene" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-chart-box-outline"></i>
                                    </span>
                                    <span>Single-gene Curator</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="multi-gene" target="_blank">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-chart-box-multiple-outline"></i>
                                    </span>
                                    <span>Multi-gene Displays</span>
                                </span>
                            </a>
                            <hr class="dropdown-divider">
                            <a class="dropdown-item" data-tool="download-bundle">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-briefcase-download-outline"></i>
                                    </span>
                                    <span>Download Bundle</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="download-h5ad">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-file-download-outline"></i>
                                    </span>
                                    <span>Download H5AD</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="download-image">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-image"></i>
                                    </span>
                                    <span>Download Image</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="download-projection">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-hexagon-multiple"></i>
                                    </span>
                                    <span>Download Projection</span>
                                </span>
                            </a>
                            <a class="dropdown-item" data-tool="download-metadata">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="mdi mdi-24px mdi-file-code-outline"></i>
                                    </span>
                                    <span>Download Metadata</span>
                                </span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <div class="js-card-extras content is-small columns m-0">
            <!-- Extra options, etc go here -->
        </div>
        <div class="card-image"></div>
    </div>
</template>

<template id="tmpl-tile-grid-dropdown-link">
    <a class="dropdown-item" target="_blank">
        <span class="icon-text">
            <span class="icon">
                <i class="mdi mdi-24px mdi-link"></i>
            </span>
            <span class="js-link-label"></span>
        </span>
    </a>
</template>

<template id="tmpl-tile-grid-choose-display-modal">
    <div class="js-choose-display-modal modal">
        <div class="modal-background"></div>
        <div class="modal-content">
            <div class="box has-background-white-ter">
                <h5 class="title is-5"></h5>
                <div class="js-modal-user-displays columns is-multiline">
                    <img>
                </div>
                <div class="js-modal-owner-displays columns is-multiline">
                    <img>
                </div>
            </div>
        </div>
        <button class="modal-close is-large has-background-link" aria-label="close"></button>
    </div>
</template>

<template id="tmpl-tile-grid-choose-display-modal-display">
    <div class="js-modal-display column is-3 is-clickable p-1 mb-3">
        <p class="js-modal-display-label is-size-6 has-text-weight-semibold has-text-grey-dark mb-1" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></p>
        <p class="js-modal-display-detail is-size-7 has-text-grey-dark mb-1 is-hidden" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></p>
        <figure class="image is-4by3">
            <img alt="Saved display">
            <span class="js-modal-display-type tag is-info is-relative"></span>
        </figure>
    </div>
</template>

<template id="tmpl-tile-grid-projection-info">
    <div class="column p-0">
        <div class="notification is-primary is-light p-1">
            <p></p>
        </div>
    </div>
</template>

<template id="tmpl-tile-grid-ortholog-dropdown">
    <div class="column is-4 p-0">
        <div class="dropdown js-ortholog-dropdown">
            <div class="dropdown-trigger">
                <button class="button" aria-haspopup="true">
                <span><strong>Choose ortholog</strong></span>
                    <span class="icon is-small">
                        <i class="mdi mdi-chevron-down" aria-hidden="true"></i>
                    </span>
                </button>
                </div>
                <div class="dropdown-menu" role="menu">
                <div class="dropdown-content">
                    <!-- add orthologs here -->
                </div>
            </div>
        </div>
    </div>
</template>

<template id="tmpl-tile-gene-not-found-help">
    <!-- Gene-not-found message (centered, like other tile messages) with a left-aligned footer strip
         that helps find genes the dataset does have.
         No <p> elements: tile CSS makes every <p> in .card-image a 200px-tall loading/error message.
         Layout uses Bulma helpers and inline styles instead of page CSS, so it looks the same on every page. -->
    <div class="js-gene-not-found-help is-flex is-flex-direction-column p-2 m-2"
        style="min-height: 200px;" data-testid="gene-not-found-help">
        <div class="js-gene-not-found-message is-flex is-flex-grow-1 is-align-items-center is-justify-content-center has-text-centered has-text-weight-bold p-2"></div>
        <div class="js-gene-not-found-footer has-text-left pt-2 px-2" style="border-top: 1px solid rgba(0, 0, 0, 0.1);">
            <div class="js-similar-genes is-hidden mb-1" data-testid="similar-genes">
                <div class="is-size-7 mb-1">Similar genes in this dataset (each opens a new search in a new tab):</div>
                <div class="js-similar-genes-tags tags mb-0"></div>
            </div>
            <div>
                <a class="js-gene-list-link is-size-7" target="_blank" rel="noopener" data-testid="gene-list-link">
                    <span class="icon-text">
                        <span class="icon">
                            <i class="mdi mdi-format-list-bulleted" aria-hidden="true"></i>
                        </span>
                        <!-- Underline goes on the text: icon-text is inline-flex, which does not inherit the link's underline -->
                        <span class="is-underlined">View all genes in this dataset</span>
                        <span class="is-sr-only">(opens in a new tab)</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</template>

<template id="tmpl-tile-infobox">
    <div class="modal js-infobox">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Dataset information</p>
                <button class="delete" aria-label="close"></button>
            </header>
            <section class="modal-card-body">
                <h5 class="js-infobox-title title is-5"></h5>
                <div class="js-infobox-ldesc content"></div>
                <p class="js-infobox-gene-list mb-4">
                    <a class="js-infobox-gene-list-link" target="_blank" rel="noopener" data-testid="infobox-gene-list-link">
                        <span class="icon-text">
                            <span class="icon">
                                <i class="mdi mdi-format-list-bulleted" aria-hidden="true"></i>
                            </span>
                            <span>View genes in this dataset</span>
                            <span class="is-sr-only">(opens in a new tab)</span>
                        </span>
                    </a>
                </p>

                <div class="js-infograph-illustration"></div>
                <figure class="image">
                    <img class="js-infobox-schematic" src="" alt="Infograph" />
                </figure>
            </section>
        </div>
    </div>
</template>
<template id="tmpl-tile-grid-citation-modal">
    <div class="modal js-citation">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Citation</p>
                <button class="delete" aria-label="close"></button>
            </header>
            <section class="modal-card-body">
                <div class="js-citation-content content">
                </div>
            </section>
            <section class="modal-card-foot is-justify-content-space-between">
                <button class="button is-link js-citation-copy">
                    <span class="icon">
                        <i class="mdi mdi-24px mdi-content-copy"></i>
                    </span>
                    <span>Copy to clipboard</span>
                </button>
            </section>
        </div>
    </div>
</template>
