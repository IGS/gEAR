<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en"> <!--<![endif]-->
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>gEAR - Studies</title>
        <meta name="description" content="Browse published studies with landing pages describing their data, figures and how to explore them.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="-1">
        <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">

        <!-- This is needed because mod_rewrite doesn't work well with relative paths.  This will need
             to be changed for any hosts where gEAR is not at the webserver root.
          -->
        <base href="/" />

        <link rel="stylesheet" href="css/gear-theme-purple.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
    </head>
    <body>
      <div id="main-layout-c" class="columns is-fullheight">

        <!--#include virtual="/include/primary_nav.html" -->

        <section id="main-c" class="column pl-0 pt-0">

          <!--#include virtual="/include/header_bar.html" -->

          <!-- Lists every landing page in www/landing/ for this portal (see js/landing.js) -->
          <section id="content-c" role="main" class="m-3 container" data-nav-link="landing_pages">

            <div class="studies-intro">
              <h2 class="title is-4 mb-2">Studies</h2>
              <p>
                Each study below has its own landing page, written by its authors, describing the
                work and linking straight to its data, figures and displays in
                <span class="js-domain-label">gEAR</span>.
              </p>
            </div>

            <div class="studies-toolbar" role="search">
              <div class="control has-icons-left studies-filter">
                <input id="studies-filter" class="input" type="search" placeholder="Filter by title, author or topic"
                       aria-label="Filter studies" autocomplete="off" disabled>
                <span class="icon is-left" aria-hidden="true"><i class="mdi mdi-magnify"></i></span>
              </div>
              <div class="select studies-sort">
                <select id="studies-sort" aria-label="Sort studies" disabled>
                  <option value="newest">Newest first</option>
                  <option value="oldest">Oldest first</option>
                  <option value="title">Title A–Z</option>
                </select>
              </div>
              <p id="studies-count" class="studies-count" aria-live="polite"></p>
            </div>

            <ul id="studies-list" class="studies-list" aria-label="Study landing pages" aria-busy="true">
              <li class="studies-loading">
                <span class="icon is-large"><i class="mdi mdi-loading mdi-spin mdi-36px"></i></span>
              </li>
            </ul>

            <div id="studies-no-match" class="studies-message" hidden>
              <span class="icon is-large"><i class="mdi mdi-text-search-variant mdi-36px"></i></span>
              <p>No studies match “<span id="studies-no-match-term"></span>”.</p>
              <button id="studies-clear-filter" type="button" class="button is-small is-rounded">Clear filter</button>
            </div>

            <div id="studies-unavailable" class="studies-message" hidden>
              <span class="icon is-large"><i class="mdi mdi-book-off-outline mdi-36px"></i></span>
              <p id="studies-unavailable-text">There are no study landing pages here yet.</p>
            </div>

          </section><!-- end #content-c -->
        </section> <!-- end #main-c -->
      </div>
      <footer>
        <div id="funding"></div>
</footer>

      <script src="js/vendor/js.cookie.js"></script>

      <!-- Helps ensure the user gets the latest code, needed while we're pushing out so many updates -->
      <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

      <!-- Page-specific CSS/JS loading here -->
      <script type="module">
        import { getDomainPreferences, insertVersionedCSS, insertVersionedJS, loadDomainFunding } from './js/common.v2.js';
        const prefs = await getDomainPreferences();

        // Portal name in the page text
        if (typeof prefs.domain_short_display_label === 'string' && prefs.domain_short_display_label.trim()) {
          for (const el of document.querySelectorAll('.js-domain-label')) {
            el.textContent = prefs.domain_short_display_label;
          }
        }

        await loadDomainFunding(prefs);

        // Load any local JS with cache-busting version parameter
        insertVersionedJS('js/landing.js', prefs.cache_version);

        // Now load page-specific CSS
        insertVersionedCSS('css/common.v2.css', prefs.cache_version);
        insertVersionedCSS('css/landing.css', prefs.cache_version);
      </script>

      <!-- WCAG accessibility widget -->
      <script>
      window.ACCESSIBILITY_WIDGET_CONFIG = {
        // Position on left side
        widgetPosition: {
          side: 'left',
          left: '20px',
          bottom: '20px'
        }
      };
      </script>
      <script src="https://unpkg.com/accessibility-widgets@latest/widget.js"></script>

    </body>
</html>
